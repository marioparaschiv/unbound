pre-commit:
    commands:
        format-js:
            glob: '*.{ts,tsx,js,mjs,json,md,yml,yaml}'
            run: bunx oxfmt --config .oxfmtrc.json --no-error-on-unmatched-pattern {staged_files}
            stage_fixed: true
        format-loader:
            root: 'packages/loader/'
            glob: '*.{c,cc,cpp,h,hpp,m,mm,x,xm,go,kt,kts}'
            run: go run ./tools format {staged_files}
            stage_fixed: true
        plugins:
            run: bun run plugins:validate
        plugins-readme:
            # Includes deletions, so removing a plugin also drops it and its icon from the README.
            files: git diff --cached --name-only --diff-filter=ACDMR -- 'packages/plugins/*/manifest.json' 'assets/plugins/icons/*.png'
            glob:
                - 'packages/plugins/*/manifest.json'
                - 'assets/plugins/icons/*.png'
            run: bun run plugins:readme && git add packages/plugins/README.md assets/plugins/readme-icons

pre-push:
    commands:
        affected-checks:
            run: bun scripts/pre-push.ts

commit-msg:
    commands:
        commitlint:
            env:
                PATH: './node_modules/.bin:$PATH'
            run: commitlint --edit "{1}"
