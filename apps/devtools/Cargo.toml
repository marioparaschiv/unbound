[workspace]
resolver = "3"
members = ["crates/core", "crates/repl", "crates/app"]

[workspace.package]
version = "1.7.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/marioparaschiv/unbound"

[workspace.dependencies]
unbound-devtools-core = { path = "crates/core" }
unbound-devtools-repl = { path = "crates/repl" }
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
	"rt-multi-thread",
	"net",
	"sync",
	"macros",
	"time",
	"io-std",
	"io-util",
	"process",
] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rmcp = { version = "3.8", features = [
	"server",
	"transport-io",
	"transport-streamable-http-server",
] }
schemars = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
jaq-core = "3.1"
jaq-std = "3.0"
jaq-json = "2.0"
dirs = "5"
if-addrs = "0.15"
mdns-sd = { version = "0.21", default-features = false, features = ["async"] }
gethostname = "1"
base64 = "0.22"
percent-encoding = "2"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
ureq = "3.5"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
# The console's TypeScript checker and language server, run in-process. Pinned: tsrs is a beta port.
tsrs_lsp = "=0.24.0"
tsrs_vfs = "=0.24.0"
tsrs_core = "=0.24.0"
oxc = { version = "0.158", features = ["transformer", "codegen", "semantic", "ast_visit"] }
# The version gpui-component's editor speaks, so completions and hovers pass through unconverted.
lsp-types = { version = "0.97", features = ["proposed"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gpui = { package = "gpui-fast", version = "0.1.14" }
gpui-component = { version = "0.9.1", features = ["gpui-fast", "tree-sitter-typescript"] }
gpui-kit-assets = { version = "0.9.1", features = ["gpui-fast"] }
# Without font-kit, the macOS build draws no text.
gpui_platform = { package = "gpui-fast-platform", version = "0.1.14", features = [
	"font-kit",
	"x11",
	"wayland",
] }

# gpui-fast 0.1.14 plus `Window::with_sprite_transformation`, which presses the sidebar's text on
# the GPU. Source: unbound-app/gpui-fast branch unbound/v0.1.14-sprite-transform; this rev is its
# generated crates.io packages. All nine are patched so the backends share one gpui-fast.
[patch.crates-io]
gpui-fast = { git = "https://github.com/unbound-app/gpui-fast", rev = "4e71a31f77b1a763e316754e19638f6f3ad222df" }
gpui-fast-macros = { git = "https://github.com/unbound-app/gpui-fast", rev = "4e71a31f77b1a763e316754e19638f6f3ad222df" }
gpui-fast-apple = { git = "https://github.com/unbound-app/gpui-fast", rev = "4e71a31f77b1a763e316754e19638f6f3ad222df" }
gpui-fast-wgpu = { git = "https://github.com/unbound-app/gpui-fast", rev = "4e71a31f77b1a763e316754e19638f6f3ad222df" }
gpui-fast-macos = { git = "https://github.com/unbound-app/gpui-fast", rev = "4e71a31f77b1a763e316754e19638f6f3ad222df" }
gpui-fast-linux = { git = "https://github.com/unbound-app/gpui-fast", rev = "4e71a31f77b1a763e316754e19638f6f3ad222df" }
gpui-fast-windows = { git = "https://github.com/unbound-app/gpui-fast", rev = "4e71a31f77b1a763e316754e19638f6f3ad222df" }
gpui-fast-web = { git = "https://github.com/unbound-app/gpui-fast", rev = "4e71a31f77b1a763e316754e19638f6f3ad222df" }
gpui-fast-platform = { git = "https://github.com/unbound-app/gpui-fast", rev = "4e71a31f77b1a763e316754e19638f6f3ad222df" }

[profile.release]
lto = "thin"
codegen-units = 4
