name: Setup ccache
description: Installs ccache, restores its cache for one job and makes every CMake build in the job compile through it.

inputs:
    key:
        description: Names the job's cache, so jobs that build different code keep separate caches.
        required: true
    hash-dir:
        description: Hashes the working directory into -g builds. Turn it off where the build directory's name changes per run.
        required: false
        default: 'true'

runs:
    using: composite
    steps:
        - name: Install ccache
          shell: bash
          run: |
              if command -v ccache > /dev/null; then
                  exit 0
              fi
              if [ "$RUNNER_OS" = macOS ]; then
                  brew install ccache > /dev/null
              elif ! sudo apt-get install -y -qq ccache > /dev/null; then
                  # The image's package lists usually still resolve ccache; refreshing them costs about 10 s.
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq ccache > /dev/null
              fi

        - name: Restore the compiler cache
          uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
          with:
              path: ${{ runner.temp }}/ccache
              key: ccache-${{ runner.os }}-${{ inputs.key }}-${{ github.sha }}
              restore-keys: ccache-${{ runner.os }}-${{ inputs.key }}-

        - name: Route CMake through ccache
          shell: bash
          run: |
              {
                  echo "CCACHE_DIR=${{ runner.temp }}/ccache"
                  echo "CCACHE_BASEDIR=${{ github.workspace }}"
                  echo "CCACHE_COMPRESS=true"
                  echo "CCACHE_MAXSIZE=500M"
                  # Builds with -g hash the working directory. AGP names its CMake directory after the build's
                  # arguments, so its pull requests never hit main's objects unless the directory is left out.
                  if [ "${{ inputs.hash-dir }}" = false ]; then
                      echo "CCACHE_NOHASHDIR=true"
                  fi
                  echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
                  echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
              } >> "$GITHUB_ENV"
              ccache --zero-stats > /dev/null
