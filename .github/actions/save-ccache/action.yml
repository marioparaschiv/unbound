name: Save ccache
description: Reports the job's compiler cache statistics in the step summary and, on main, saves the cache setup-ccache restored.

inputs:
    key:
        description: The same key the job passed to setup-ccache.
        required: true

runs:
    using: composite
    steps:
        - name: Report the compiler cache
          if: ${{ !cancelled() }}
          shell: bash
          run: |
              # A failure before Setup ccache leaves nothing to report.
              command -v ccache > /dev/null || exit 0
              {
                  echo "### Compiler cache"
                  echo
                  echo '```'
                  ccache --show-stats
                  echo '```'
              } | tee -a "$GITHUB_STEP_SUMMARY"

        - name: Save the compiler cache
          if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
          uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
          with:
              path: ${{ runner.temp }}/ccache
              key: ccache-${{ runner.os }}-${{ inputs.key }}-${{ github.sha }}
