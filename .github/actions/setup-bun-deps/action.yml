name: Setup Bun dependencies
description: Installs Bun, restores its install cache and installs the workspace dependencies.

inputs:
    bun-version:
        description: Bun version to install; every workflow uses this default.
        required: false
        default: canary
    install:
        description: Whether to run bun install after restoring the cache.
        required: false
        default: 'true'
    frozen-lockfile:
        description: Whether bun install must fail when bun.lock is out of date.
        required: false
        default: 'false'

runs:
    using: composite
    steps:
        # GitHub release downloads sometimes answer 504, so a failed install waits and tries once more.
        - name: Setup Bun
          id: setup-bun
          continue-on-error: true
          uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
          with:
              bun-version: ${{ inputs.bun-version }}

        - name: Wait before retrying Setup Bun
          if: steps.setup-bun.outcome == 'failure'
          shell: bash
          run: sleep 30

        - name: Retry Setup Bun
          if: steps.setup-bun.outcome == 'failure'
          uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
          with:
              bun-version: ${{ inputs.bun-version }}

        - name: Cache Bun installs
          uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
          with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
              restore-keys: bun-${{ runner.os }}-

        - name: Install dependencies
          if: inputs.install == 'true'
          shell: bash
          env:
              FROZEN_LOCKFILE: ${{ inputs.frozen-lockfile }}
          run: |
              if [ "$FROZEN_LOCKFILE" = true ]; then
                  bun install --frozen-lockfile
              else
                  bun install
              fi
