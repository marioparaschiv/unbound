name: Secret scan

on:
    pull_request:
    push:
        branches: [main]
    schedule:
        - cron: '17 4 * * 1'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: secret-scan-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    GITLEAKS_VERSION: 8.30.1
    GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
    gitleaks:
        name: Gitleaks
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Install gitleaks
              run: |
                  curl --fail --location --silent --show-error --retry 3 \
                      "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
                      -o gitleaks.tar.gz
                  echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
                  tar -xzf gitleaks.tar.gz gitleaks
                  rm gitleaks.tar.gz

            - name: Scan the new commits, or all history on the weekly run
              env:
                  EVENT: ${{ github.event_name }}
                  BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
                  HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
              run: |
                  range=()
                  if [ "$EVENT" = pull_request ] || { [ "$EVENT" = push ] && [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; }; then
                      range=(--log-opts "$BASE..$HEAD")
                  fi
                  ./gitleaks git . --no-banner --redact --config .gitleaks.toml "${range[@]}"
