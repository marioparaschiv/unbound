name: Discord compatibility scan

on:
    schedule:
        - cron: '23 */6 * * *'
    workflow_dispatch:
        inputs:
            channel:
                description: Discord release channel to scan
                type: choice
                options: [stable, beta, alpha]
                default: stable

permissions:
    contents: read

concurrency:
    group: discord-compat-${{ github.ref }}-${{ inputs.channel || 'all' }}
    cancel-in-progress: false

jobs:
    scan:
        name: scan (${{ matrix.channel }})
        runs-on: macos-15
        timeout-minutes: 45
        permissions:
            actions: read
            contents: read
            issues: write
        strategy:
            fail-fast: false
            matrix:
                channel: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.channel) || '["stable","beta","alpha"]') }}
        defaults:
            run:
                working-directory: packages/loader
        env:
            CHANNEL: ${{ matrix.channel }}
            IOS_SOURCE: ${{ matrix.channel == 'stable' && 'appstore' || matrix.channel == 'beta' && 'testflight' || 'none' }}
            DISCORD_SNIFF_URL: https://sniff.xhyrom.dev
            DISCORD_TRACKER: https://tracker.vendetta.rocks/tracker
            DKRYPT_BASE_URL: ${{ vars.DKRYPT_BASE_URL || 'https://ipa.dylib.dev' }}
            GH_TOKEN: ${{ github.token }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - name: Setup Go tools
              uses: ./.github/actions/setup-go-tools

            - name: Restore the cached Discord builds
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
              with:
                  path: ~/.cache/unbound-discord
                  key: discord-builds-${{ matrix.channel }}-
                  restore-keys: discord-builds-${{ matrix.channel }}-

            - name: Download Discord for iOS
              id: ios
              if: env.IOS_SOURCE != 'none'
              continue-on-error: true
              timeout-minutes: 12
              uses: castdrian/dkrypt@90e77358afff7fc913376dd732d30b222f922e0d
              with:
                  api-url: ${{ env.DKRYPT_BASE_URL }}
                  api-key: ${{ secrets.DKRYPT_API_KEY }}
                  bundle-id: com.hammerandchisel.discord
                  channel: ${{ env.IOS_SOURCE }}
                  output: packages/loader/discord.ipa

            - name: Keep or reuse the last decrypted iOS build
              if: env.IOS_SOURCE != 'none'
              run: |
                  set -euo pipefail
                  kept="$HOME/.cache/unbound-discord/last-ipa/$IOS_SOURCE.ipa"
                  if [ -f discord.ipa ]; then
                      mkdir -p "${kept%/*}"
                      cp discord.ipa "$kept"
                  elif [ -f "$kept" ]; then
                      cp "$kept" discord.ipa
                      echo "::warning title=Older iOS build::dkrypt did not decrypt a new iOS $IOS_SOURCE build, so this scan uses the last one it did."
                  fi

            - name: Find the platform SDKs
              id: sdks
              run: |
                  set -euo pipefail
                  ios_sdk=$(xcrun --sdk iphoneos --show-sdk-path)
                  android_jar=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" -path '*/android-*/android.jar' | sort -V | tail -n 1)
                  test -d "$ios_sdk" && test -f "$android_jar"
                  echo "ios=$ios_sdk" >> "$GITHUB_OUTPUT"
                  echo "android=$android_jar" >> "$GITHUB_OUTPUT"

            - name: Restore the previous scan
              run: |
                  set -euo pipefail
                  for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow discord-compat.yml --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
                    if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "compat-$CHANNEL" --dir baseline 2>/dev/null; then
                      echo "Using the scan from run $run as the baseline"
                      break
                    fi
                  done

            - name: Scan
              env:
                  IOS_SDK: ${{ steps.sdks.outputs.ios }}
                  ANDROID_JAR: ${{ steps.sdks.outputs.android }}
              run: |
                  set -euo pipefail
                  scan_args=(
                    --root ../..
                    --channel "$CHANNEL"
                    --cache "$HOME/.cache/unbound-discord"
                    --ios-sdk "$IOS_SDK"
                    --android-jar "$ANDROID_JAR"
                    --baseline baseline/compat.json
                    --results compat.json
                    --report report.md
                    --source-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA"
                  )
                  if [ "$IOS_SOURCE" != none ] && [ -f discord.ipa ]; then
                    scan_args+=(--ipa discord.ipa)
                  elif [ "$IOS_SOURCE" != none ]; then
                    echo "::warning title=No new iOS build::dkrypt did not decrypt the iOS $IOS_SOURCE build in time, so this scan uses its latest cached iOS build or Android only."
                  fi
                  unbound-tools compat-scan "${scan_args[@]}"
                  cat report.md >> "$GITHUB_STEP_SUMMARY"

            - name: Name the Discord builds cache
              id: builds
              run: |
                  set -euo pipefail
                  cache="$HOME/.cache/unbound-discord"
                  contents=$(find "$cache" -type f 2>/dev/null | sort | while read -r file; do echo "${file#"$cache"/} $(wc -c < "$file")"; done | shasum -a 256 | cut -c1-16)
                  echo "key=discord-builds-$CHANNEL-$contents" >> "$GITHUB_OUTPUT"

            - name: Save the Discord builds when they changed
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
              continue-on-error: true
              with:
                  path: ~/.cache/unbound-discord
                  key: ${{ steps.builds.outputs.key }}

            - name: Upload the scan
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: compat-${{ matrix.channel }}
                  path: |
                      packages/loader/compat.json
                      packages/loader/report.md
                  retention-days: 90

            - name: Open, supersede or close the issue
              if: github.ref_name == github.event.repository.default_branch
              run: |
                  set -euo pipefail
                  gh label create discord-compat --repo "$GITHUB_REPOSITORY" --color D93F0B --description "A Discord build breaks part of Unbound" --force >/dev/null
                  unbound-tools compat-issue --repo "$GITHUB_REPOSITORY" --channel "$CHANNEL" --results compat.json --report report.md

            - name: Track the legacy names the oldest supported build no longer has
              if: matrix.channel == 'stable' && github.ref_name == github.event.repository.default_branch
              run: |
                  set -euo pipefail
                  gh label create discord-compat-cleanup --repo "$GITHUB_REPOSITORY" --color 0E8A16 --description "Code for names Discord no longer ships can be removed" --force >/dev/null
                  unbound-tools compat-legacy-issue --repo "$GITHUB_REPOSITORY" --results compat.json --source-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA"

            - name: Remind to raise the oldest supported Discord
              if: matrix.channel == 'stable' && github.ref_name == github.event.repository.default_branch
              run: |
                  set -euo pipefail
                  gh label create discord-support-policy --repo "$GITHUB_REPOSITORY" --color 5319E7 --description "The oldest supported Discord version is due to be raised" --force >/dev/null
                  unbound-tools compat-support-issue --repo "$GITHUB_REPOSITORY" --results compat.json --source-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA"
