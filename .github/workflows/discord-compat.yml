name: Discord compatibility scan

on:
    schedule:
        - cron: '23 7 * * *'
    workflow_dispatch:
        inputs:
            channel:
                description: Discord release channel to scan
                type: choice
                options: [stable, beta]
                default: stable

permissions:
    contents: read

concurrency:
    group: discord-compat-${{ github.ref }}
    cancel-in-progress: false

jobs:
    scan:
        name: scan (${{ matrix.channel }})
        runs-on: macos-15
        timeout-minutes: 45
        permissions:
            actions: read
            contents: read
            issues: write
        strategy:
            fail-fast: false
            matrix:
                channel: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.channel) || '["stable","beta"]') }}
        defaults:
            run:
                working-directory: packages/loader
        env:
            CHANNEL: ${{ matrix.channel }}
            DISCORD_TRACKER: https://tracker.vendetta.rocks/tracker
            DKRYPT_BASE_URL: ${{ vars.DKRYPT_BASE_URL || 'https://ipa.dylib.dev' }}
            GH_TOKEN: ${{ github.token }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - name: Setup Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
              with:
                  cache: false
                  go-version-file: packages/loader/go.mod

            - name: Cache Go builds
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
              with:
                  path: |
                      ~/.cache/go-build
                      ~/Library/Caches/go-build
                      ~/go/pkg/mod
                  key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/loader/go.mod', 'packages/loader/tools/**/*.go') }}
                  restore-keys: go-${{ runner.os }}-${{ runner.arch }}-

            - name: Download Discord for Android
              id: android
              run: |
                  set -euo pipefail
                  code=$(curl -fsSL "$DISCORD_TRACKER/index" | jq -r ".latest.$CHANNEL")
                  curl -fsSL -o discord.apk "$DISCORD_TRACKER/download/$code/base"
                  echo "version=$((code / 1000)).$((code % 1000))" >> "$GITHUB_OUTPUT"

            - name: Download Discord for iOS
              env:
                  DKRYPT_API_KEY: ${{ secrets.DKRYPT_API_KEY }}
              run: |
                  set -euo pipefail
                  if [ "$CHANNEL" = stable ]; then
                    go run ./tools fetch --base-url "$DKRYPT_BASE_URL" --bundle-id com.hammerandchisel.discord --output discord.ipa
                  else
                    IPA_DIR="$RUNNER_TEMP/ipa" python3 ../../.agents/skills/dkrypt/scripts/fetch-ipa.py com.hammerandchisel.discord testflight
                    mv "$RUNNER_TEMP"/ipa/*.ipa discord.ipa
                  fi

            - name: Find the platform SDKs
              id: sdks
              run: |
                  set -euo pipefail
                  ios_sdk=$(xcrun --sdk iphoneos --show-sdk-path)
                  android_jar=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" -path '*/android-*/android.jar' | sort -V | tail -n 1)
                  test -d "$ios_sdk" && test -f "$android_jar"
                  echo "ios=$ios_sdk" >> "$GITHUB_OUTPUT"
                  echo "android=$android_jar" >> "$GITHUB_OUTPUT"

            - name: Restore the previous scan
              run: |
                  set -euo pipefail
                  for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow discord-compat.yml --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
                    if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "compat-$CHANNEL" --dir baseline 2>/dev/null; then
                      echo "Using the scan from run $run as the baseline"
                      break
                    fi
                  done

            - name: Scan
              run: |
                  set -euo pipefail
                  go run ./tools compat-scan \
                    --root ../.. \
                    --channel "$CHANNEL" \
                    --ipa discord.ipa \
                    --apk discord.apk \
                    --android-version "${{ steps.android.outputs.version }}" \
                    --ios-sdk "${{ steps.sdks.outputs.ios }}" \
                    --android-jar "${{ steps.sdks.outputs.android }}" \
                    --baseline baseline/compat.json \
                    --results compat.json \
                    --report report.md \
                    --source-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA"
                  cat report.md >> "$GITHUB_STEP_SUMMARY"

            - name: Upload the scan
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: compat-${{ matrix.channel }}
                  path: |
                      packages/loader/compat.json
                      packages/loader/report.md
                  retention-days: 90

            - name: Open, supersede or close the issue
              if: github.ref_name == github.event.repository.default_branch
              run: |
                  set -euo pipefail
                  gh label create discord-compat --repo "$GITHUB_REPOSITORY" --color D93F0B --description "A Discord build breaks part of Unbound" --force >/dev/null
                  go run ./tools compat-issue --repo "$GITHUB_REPOSITORY" --channel "$CHANNEL" --results compat.json --report report.md
