name: Loader Pull Request Build

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        paths:
            - 'packages/loader/**'
            - '.github/workflows/loader-*.yml'
            - '.github/actions/**'
            - '.gitmodules'
            - 'packages/types/typings/native.ts'

permissions:
    contents: read
    pull-requests: write
    id-token: write
    attestations: write
    artifact-metadata: write

concurrency:
    group: loader-pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true

defaults:
    run:
        working-directory: packages/loader

jobs:
    validate-submodules:
        name: Validate submodules
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  submodules: recursive
                  fetch-depth: 1

            - name: Verify submodule state
              run: |
                  set -euo pipefail
                  status="$(git submodule status --recursive)"
                  if printf '%s\n' "$status" | grep -Eq '^[+-U]'; then
                      printf '%s\n' "$status"
                      exit 1
                  fi
                  git submodule foreach --recursive 'git diff --exit-code'

    lint:
        name: Lint and format
        runs-on: ubuntu-26.04
        timeout-minutes: 6
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 1

            - name: Setup Go tools
              uses: ./.github/actions/setup-go-tools

            - name: Setup Java
              uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
              with:
                  distribution: temurin
                  java-version: '17'

            - name: Install clang-format and actionlint
              run: |
                  set -euo pipefail
                  pipx install clang-format==23.1.3
                  go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
                  echo "$HOME/.local/bin" >> "$GITHUB_PATH"
                  echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

            - name: Lint and check formatting
              run: go run ./tools lint

    build:
        name: Build Unbound
        permissions:
            contents: write
            id-token: write
            attestations: write
            artifact-metadata: write
        uses: ./.github/workflows/loader-build.yml
        with:
            ipa_url: https://raw.githubusercontent.com/Tulugaak/Discord-205.0-IPA/4eec98e61e20d0720c091d42c4a762710b32e8c5/com.hammerandchisel.discord_861573261.ipa
            release: false
            caller_workflow: 'ci'
        secrets: inherit

    comment-pr:
        name: Comment on PR
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        needs: build
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 1

            - name: Delete existing comment
              uses: izhangzhihao/delete-comment@d075704468e1cf74e60944d9f335351213c34d85
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  delete_user_name: github-actions[bot]
                  issue_number: ${{ github.event.number }}

            - name: Get build info
              id: build-info
              run: |
                  COMMIT_HASH=$(git rev-parse --short HEAD)
                  BUILD_TIME=$(date "+%Y-%m-%d %H:%M:%S")

                  echo "hash=$COMMIT_HASH" >> "$GITHUB_OUTPUT"
                  echo "time=$BUILD_TIME" >> "$GITHUB_OUTPUT"

            - name: Comment on current PR
              uses: thollander/actions-comment-pull-request@e4a76dd2b0a3c2027c3fd84147a67c22ee4c90fa
              with:
                  message: |
                      **Commit**: [#${{ steps.build-info.outputs.hash }}](https://github.com/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }})
                      **Build Time**: `${{ steps.build-info.outputs.time }}`

                      #### iOS
                      - [**${{ needs.build.outputs.deb_filename }}**](${{ needs.build.outputs.deb_url }})
                      - [**${{ needs.build.outputs.simulator_filename }}**](${{ needs.build.outputs.simulator_url }})
                      - [**${{ needs.build.outputs.ipa_filename }}**](${{ needs.build.outputs.ipa_url }})

                      #### Android
                      - [**${{ needs.build.outputs.module_filename }}**](${{ needs.build.outputs.module_url }})
                      - [**${{ needs.build.outputs.patched_filename }}**](${{ needs.build.outputs.patched_url }})

                      <sub>This comment was automatically generated. [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>
                  comment-tag: build-result
                  github-token: ${{ secrets.GITHUB_TOKEN }}
