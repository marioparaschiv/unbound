name: Loader Pull Request Build

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        paths:
            - 'packages/loader/**'
            - '.github/workflows/loader-*.yml'
            - '.github/actions/**'
            - '.github/workflows/pr-builds-cleanup.yml'
            - 'packages/client/**'
            - 'scripts/pr-builds*.ts'
            - 'packages/plugins/**'
            - 'packages/plugins-shared/**'
            - '.gitmodules'
            - 'packages/types/typings/native.ts'
            - '!**/*.md'
            - '!**/*.mdx'

permissions:
    contents: read

concurrency:
    group: loader-pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true

defaults:
    run:
        working-directory: packages/loader

jobs:
    changes:
        name: Detect loader changes
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: read
        # No checkout here, so the workflow's packages/loader default does not exist.
        defaults:
            run:
                working-directory: .
        outputs:
            native: ${{ steps.files.outputs.native }}
            ios: ${{ steps.files.outputs.ios }}
            release: ${{ steps.files.outputs.release }}
            ios_version: ${{ steps.source.outputs.version }}
            ipa_url: ${{ steps.source.outputs.ipa_url }}
        steps:
            - name: List the changed loader files
              id: files
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  set -euo pipefail
                  files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
                  if grep -Eq '^(packages/loader/|\.github/workflows/loader-|\.github/actions/|\.gitmodules$)' <<< "$files" \
                      && grep -E '^(packages/loader/|\.github/workflows/loader-|\.github/actions/|\.gitmodules$)' <<< "$files" | grep -Evq '\.mdx?$'; then
                      echo "native=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "native=false" >> "$GITHUB_OUTPUT"
                  fi
                  if grep -Evq '^(packages/loader/android/|\.github/workflows/loader-android\.yml$)|\.mdx?$' <<< "$files"; then
                      echo "ios=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "ios=false" >> "$GITHUB_OUTPUT"
                  fi
                  if grep -Eq '^(packages/loader/tools/(release|loader_release|loader_changelog|sbom|http_retry)[a-z_]*\.go|\.github/workflows/(loader-build|loader-release-poll|release-dry-run)\.yml)$' <<< "$files"; then
                      echo "release=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "release=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Pick the iOS source
              id: source
              env:
                  HAS_DKRYPT_KEY: ${{ secrets.DKRYPT_API_KEY != '' }}
                  FALLBACK_IPA_URL: https://raw.githubusercontent.com/Tulugaak/Discord-205.0-IPA/4eec98e61e20d0720c091d42c4a762710b32e8c5/com.hammerandchisel.discord_861573261.ipa
              run: |
                  set -euo pipefail
                  version=""
                  if [ "$HAS_DKRYPT_KEY" = true ]; then
                      version=$(curl -fsSL --retry 2 "https://itunes.apple.com/lookup?bundleId=com.hammerandchisel.discord" | jq -r '.results[0].version // empty' || true)
                  fi
                  if [ -n "$version" ]; then
                      echo "version=$version" >> "$GITHUB_OUTPUT"
                      echo "ipa_url=" >> "$GITHUB_OUTPUT"
                      echo "::notice title=iOS source::Building against the current App Store Discord, $version."
                  else
                      echo "version=" >> "$GITHUB_OUTPUT"
                      echo "ipa_url=$FALLBACK_IPA_URL" >> "$GITHUB_OUTPUT"
                      echo "::notice title=iOS source::No dkrypt key in this run, so it builds against the public Discord 205.0 IPA."
                  fi

    rehearse-release:
        name: Rehearse the release steps
        needs: changes
        if: needs.changes.outputs.release == 'true'
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            contents: read
        defaults:
            run:
                working-directory: packages/loader
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Setup Go tools
              uses: ./.github/actions/setup-go-tools

            - name: Run the release commands without building
              env:
                  UNBOUND_API_URL: ${{ vars.UNBOUND_API_URL }}
              run: |
                  set -euo pipefail
                  out="$RUNNER_TEMP/release"
                  mkdir -p "$out"
                  version=$(sed -n 's/^Version: *//p' ios/control)
                  unbound-tools release-pairing --ios-version 351.0 --android-code 351011 --output "$out/pairing"
                  grep -qx 'android_version=351.11' "$out/pairing"
                  GITHUB_OUTPUT="$out/names" unbound-tools release-names --release-version 351.0 --android-version 351.11
                  cat "$out/names"
                  unbound-tools sbom --version "$version" --commit "$GITHUB_SHA" --output "$out/sbom.spdx.json"
                  jq -e '.spdxVersion and (.packages | length > 0)' "$out/sbom.spdx.json" > /dev/null
                  unbound-tools generate-loader-changelog --version "$version" --output "$out/changelog.md"
                  test -s "$out/changelog.md"
                  if [ -n "$UNBOUND_API_URL" ]; then
                      unbound-tools publish-loader-releases --dry-run \
                        --api-url "${UNBOUND_API_URL%/}/api/v1/loader/releases" \
                        --version "$version" \
                        --ios-url "https://example.invalid/ios.deb" \
                        --android-url "https://example.invalid/android.apk" \
                        --changelog-file "$out/changelog.md"
                  fi

    validate-submodules:
        name: Validate submodules
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
                  submodules: recursive
                  fetch-depth: 1

            - name: Verify submodule state
              run: |
                  set -euo pipefail
                  status="$(git submodule status --recursive)"
                  if printf '%s\n' "$status" | grep -Eq '^[+-U]'; then
                      printf '%s\n' "$status"
                      exit 1
                  fi
                  git submodule foreach --recursive 'git diff --exit-code'

    lint:
        name: Lint and format
        needs: changes
        if: needs.changes.outputs.native == 'true'
        runs-on: ubuntu-26.04
        timeout-minutes: 6
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
                  fetch-depth: 1

            - name: Setup Go tools
              uses: ./.github/actions/setup-go-tools

            - name: Setup Java
              uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
              with:
                  distribution: temurin
                  java-version-file: packages/loader/android/.java-version

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
              with:
                  cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

            - name: Install clang-format, actionlint and zizmor
              run: |
                  set -euo pipefail
                  pipx install clang-format==23.1.3
                  pipx install zizmor==1.31.1
                  go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
                  echo "$HOME/.local/bin" >> "$GITHUB_PATH"
                  echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

            - name: Lint and check formatting
              run: unbound-tools lint

    pr-builds:
        name: Plan pull request uploads
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            enabled: ${{ steps.plan.outputs.enabled }}
            stage: ${{ steps.plan.outputs.stage }}
            bundle_url: ${{ steps.plan.outputs.bundle_url }}
            loader_url: ${{ steps.plan.outputs.loader_url }}
            reason: ${{ steps.plan.outputs.reason }}
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
                  fetch-depth: 1

            - name: Setup Bun dependencies
              uses: ./.github/actions/setup-bun-deps
              with:
                  install: 'false'

            - name: Plan the uploads
              id: plan
              working-directory: .
              env:
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
                  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
                  S3_REGION: ${{ vars.S3_REGION }}
                  S3_PUBLIC_BUCKET: ${{ vars.S3_PUBLIC_BUCKET }}
                  CDN_URL: ${{ vars.CDN_URL }}
                  HAS_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID != '' }}
                  HAS_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY != '' }}
                  HAS_UNBOUND_PR_BUNDLE_SIGNING_KEY: ${{ secrets.UNBOUND_PR_BUNDLE_SIGNING_KEY != '' }}
              run: bun scripts/pr-builds-plan.ts plan

    build:
        name: Build Unbound
        needs: changes
        permissions:
            contents: write
            id-token: write
            attestations: write
            artifact-metadata: write
            actions: read
        uses: ./.github/workflows/loader-build.yml
        with:
            ipa_url: ${{ needs.changes.outputs.ipa_url }}
            version: ${{ needs.changes.outputs.ios_version }}
            release: false
            caller_workflow: 'ci'
            pr_number: ${{ github.event.pull_request.number }}
            skip_core: ${{ needs.changes.outputs.native != 'true' }}
            skip_ios_smoke: ${{ needs.changes.outputs.ios != 'true' }}
        secrets:
            ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
            ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
            ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
            ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
            UNBOUND_API_KEY: ${{ secrets.UNBOUND_API_KEY }}
            ATTESTATION_PK: ${{ secrets.ATTESTATION_PK }}
            DKRYPT_API_KEY: ${{ secrets.DKRYPT_API_KEY }}
            GPG_KEY: ${{ secrets.GPG_KEY }}
            GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

    upload-pr-builds:
        name: Upload pull request builds
        needs: [pr-builds, build]
        if: needs.pr-builds.outputs.enabled == 'true'
        runs-on: ubuntu-26.04
        timeout-minutes: 15
        permissions:
            contents: read
        concurrency:
            group: pr-builds-${{ github.event.pull_request.number }}
            cancel-in-progress: false
        defaults:
            run:
                working-directory: .
        env:
            PR_NUMBER: ${{ github.event.pull_request.number }}
            S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
            S3_REGION: ${{ vars.S3_REGION }}
            S3_PUBLIC_BUCKET: ${{ vars.S3_PUBLIC_BUCKET }}
            S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
            S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
                  fetch-depth: 1

            - name: Setup Bun dependencies
              uses: ./.github/actions/setup-bun-deps

            - name: Build the client
              env:
                  TMPDIR: ${{ runner.temp }}
                  UNBOUND_CHANNEL: pr-${{ github.event.pull_request.number }}
              run: bun run --cwd packages/client build

            - name: Sign the bundles with the pull request key
              env:
                  UNBOUND_PR_BUNDLE_SIGNING_KEY: ${{ secrets.UNBOUND_PR_BUNDLE_SIGNING_KEY }}
              run: bun run --cwd packages/client sign --dir dist --pr "$PR_NUMBER"

            - name: Check every bundle is signed
              run: bun run --cwd packages/client verify-signatures --dir dist --pr "$PR_NUMBER"

            - name: Upload the client bundles
              env:
                  UNBOUND_CHANNEL: pr
                  UNBOUND_VERSION: ${{ github.event.pull_request.number }}
              run: bun run --cwd packages/client upload

            - name: Download the iOS tweak
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
              with:
                  name: rootless package
                  path: pr-builds

            - name: Download the iOS IPA
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
              with:
                  name: ipa
                  path: pr-builds

            - name: Download the Android module
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
              with:
                  name: android module
                  path: pr-builds

            - name: Download the patched Discord
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
              with:
                  name: patched discord
                  path: pr-builds

            - name: Upload the loader builds
              run: bun scripts/pr-builds.ts upload-loader "$PR_NUMBER" pr-builds/*

            - name: Summarize the uploads
              env:
                  BUNDLE_URL: ${{ needs.pr-builds.outputs.bundle_url }}
                  LOADER_URL: ${{ needs.pr-builds.outputs.loader_url }}
              run: |
                  {
                    echo "Client bundle: $BUNDLE_URL"
                    for file in pr-builds/*; do echo "- $LOADER_URL$(basename "$file")"; done
                  } >> "$GITHUB_STEP_SUMMARY"

    stage-fork-pr-builds:
        name: Stage fork builds for publishing
        needs: [pr-builds, build]
        if: needs.pr-builds.outputs.stage == 'true'
        runs-on: ubuntu-26.04
        timeout-minutes: 15
        permissions:
            contents: read
        defaults:
            run:
                working-directory: .
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
                  fetch-depth: 1

            - name: Setup Bun dependencies
              uses: ./.github/actions/setup-bun-deps

            - name: Build the client
              env:
                  TMPDIR: ${{ runner.temp }}
                  UNBOUND_CHANNEL: pr-${{ github.event.pull_request.number }}
              run: bun run --cwd packages/client build

            - name: Record the pull request number
              env:
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  mkdir -p pr-number
                  printf '%s\n' "$PR_NUMBER" > pr-number/number

            - name: Upload the client build
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: pr client bundle
                  path: |
                      packages/client/dist/
                      !packages/client/dist/**/*.map
                  if-no-files-found: error
                  retention-days: 3

            - name: Upload the pull request number
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: pr number
                  path: pr-number/number
                  if-no-files-found: error
                  retention-days: 3

    comment-pr:
        name: Comment on PR
        runs-on: ubuntu-26.04
        permissions:
            contents: read
            pull-requests: write
        timeout-minutes: 5
        needs: [build, pr-builds, upload-pr-builds]
        if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 1

            - name: Delete existing comment
              uses: izhangzhihao/delete-comment@d075704468e1cf74e60944d9f335351213c34d85
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  delete_user_name: github-actions[bot]
                  issue_number: ${{ github.event.number }}

            - name: Get build info
              id: build-info
              run: |
                  COMMIT_HASH=$(git rev-parse --short HEAD)
                  BUILD_TIME=$(date "+%Y-%m-%d %H:%M:%S")

                  echo "hash=$COMMIT_HASH" >> "$GITHUB_OUTPUT"
                  echo "time=$BUILD_TIME" >> "$GITHUB_OUTPUT"

            - name: Setup Bun
              uses: ./.github/actions/setup-bun-deps
              with:
                  install: 'false'

            - name: Describe the S3 builds
              id: s3
              working-directory: .
              env:
                  ENABLED: ${{ needs.pr-builds.outputs.enabled }}
                  UPLOAD_RESULT: ${{ needs.upload-pr-builds.result }}
                  BUNDLE_URL: ${{ needs.pr-builds.outputs.bundle_url }}
                  LOADER_URL: ${{ needs.pr-builds.outputs.loader_url }}
                  REASON: ${{ needs.pr-builds.outputs.reason }}
                  FILES: |
                      ${{ needs.build.outputs.deb_filename }}
                      ${{ needs.build.outputs.ipa_filename }}
                      ${{ needs.build.outputs.module_filename }}
                      ${{ needs.build.outputs.patched_filename }}
              run: bun scripts/pr-builds-plan.ts comment

            - name: Comment on current PR
              uses: thollander/actions-comment-pull-request@e4a76dd2b0a3c2027c3fd84147a67c22ee4c90fa
              with:
                  message: |
                      **Commit**: [#${{ steps.build-info.outputs.hash }}](https://github.com/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }})
                      **Build Time**: `${{ steps.build-info.outputs.time }}`

                      #### iOS
                      - [**${{ needs.build.outputs.deb_filename }}**](${{ needs.build.outputs.deb_url }})
                      - [**${{ needs.build.outputs.simulator_filename }}**](${{ needs.build.outputs.simulator_url }})
                      - [**${{ needs.build.outputs.ipa_filename }}**](${{ needs.build.outputs.ipa_url }})

                      #### Android
                      - [**${{ needs.build.outputs.module_filename }}**](${{ needs.build.outputs.module_url }})
                      - [**${{ needs.build.outputs.patched_filename }}**](${{ needs.build.outputs.patched_url }})

                      ${{ steps.s3.outputs.section }}

                      <sub>This comment was automatically generated. [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>
                  comment-tag: build-result
                  github-token: ${{ secrets.GITHUB_TOKEN }}

    comment-startup:
        name: Comment the smoke test results
        runs-on: ubuntu-26.04
        permissions:
            contents: read
            pull-requests: write
        timeout-minutes: 5
        needs: [build, comment-pr]
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        strategy:
            fail-fast: false
            matrix:
                platform: [Android, iOS]
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
                  fetch-depth: 1

            - name: Download the smoke test
              id: smoke
              continue-on-error: true
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
              with:
                  name: ${{ matrix.platform == 'iOS' && 'ios smoke test' || 'android smoke test' }}
                  path: smoke

            - name: Setup Go tools
              if: steps.smoke.outcome == 'success' && hashFiles('smoke/report.md') != ''
              uses: ./.github/actions/setup-go-tools

            - name: Keep one comment with the failures and the comparison
              if: steps.smoke.outcome == 'success' && hashFiles('smoke/report.md') != ''
              working-directory: packages/loader
              env:
                  GH_TOKEN: ${{ github.token }}
                  PLATFORM: ${{ matrix.platform }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  set -euo pipefail
                  body="$RUNNER_TEMP/smoke-comment.md"
                  unbound-tools smoke-failure-summary --artifacts "$GITHUB_WORKSPACE/smoke" --output "$body"
                  if [ -s "$body" ]; then
                      unbound-tools pr-comment --pr "$PR_NUMBER" --title "$PLATFORM smoke test" --body-file "$body"
                  fi
