name: Build Bundle

# Unbound has one bundle channel: each push to main publishes to builds.unbound.rip, which every loader reads,
# and to the public bucket under `unbound/beta/{sha}/`. The channel keeps the name `beta` because loaders pin
# the manifest's channel against rollback. Versions are immutable; a version that is already published is
# skipped, never overwritten. A bundle whose `minLoaderVersion` no published loader meets on iOS and Android
# fails before anything is published; loader-publish.yml runs this again once the loader ships.
#
# Configure in the repository settings:
#   vars:    S3_ENDPOINT, S3_REGION, S3_PUBLIC_BUCKET
#   secrets: S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY
#   vars:    UNBOUND_API_URL and secrets: UNBOUND_API_KEY, to record each bundle's minimum loader

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - packages/client/src/**
            - packages/client/scripts/build/**
            - packages/rollup-plugin-hermes/src/**
    repository_dispatch:
        types:
            - hermesc-published

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-26.04
        timeout-minutes: 15
        # A later push replaces a build in flight.
        concurrency:
            group: build-bundle
            cancel-in-progress: true
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            # bun.lock is lockfileVersion 2, which stable bun cannot parse until 1.4 releases.
            # canary's frozen-lockfile check fails on a self-generated lockfile (round-trip bug),
            # so install without it until stable 1.4 lands.
            - name: Setup Bun dependencies
              uses: ./.github/actions/setup-bun-deps

            - name: Build the client
              run: bun run --cwd packages/client build
              env:
                  TMPDIR: ${{ runner.temp }}
                  UNBOUND_CHANNEL: beta
                  UNBOUND_BUNDLE_SIGNING_KEY: ${{ secrets.UNBOUND_BUNDLE_SIGNING_KEY }}

            - name: Check every bundle and the manifest are signed
              run: bun run --cwd packages/client verify-signatures

            # The loader downloads the DevTools backend for `loader.devtools` by the manifest's hash.
            - name: Check the DevTools backend is built for every bytecode version
              run: |
                  for version in $(jq -r '.bytecodeVersions[]' packages/client/scripts/build/hermes.json); do
                      jq -e --arg file "devtools.$version.bundle" '.sha512[$file]' packages/client/dist/manifest.json > /dev/null \
                          || { echo "::error::manifest.json lists no devtools.$version.bundle"; exit 1; }
                  done

            - name: Check every bundle has a source map
              run: |
                  for bundle in packages/client/dist/unbound.*.bundle; do
                      test -f "$bundle.map" || { echo "::error::$bundle has no source map"; exit 1; }
                  done

            # A bundle that needs a loader no one can install yet would leave users unable to update.
            - name: Check a published loader runs the bundle
              if: ${{ vars.UNBOUND_API_URL != '' }}
              env:
                  UNBOUND_API_URL: ${{ vars.UNBOUND_API_URL }}
              run: |
                  set -euo pipefail
                  required="$(jq -r '.minLoaderVersion' packages/client/dist/manifest.json)"
                  for platform in ios android; do
                      newest="$(curl --fail-with-body --silent --show-error \
                          "${UNBOUND_API_URL%/}/api/v1/loader/updates?platform=$platform&version=0.0.0" \
                          | jq -r '.update.version // "none"')"
                      if [ "$newest" = none ] || [ "$(printf '%s\n%s\n' "$required" "$newest" | sort -V | head -n 1)" != "$required" ]; then
                          echo "::error::The bundle needs loader $required, but the newest published $platform loader is $newest. Release the loader first; its publish runs this again."
                          exit 1
                      fi
                  done

            - name: Keep source maps
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: source-maps-${{ github.sha }}
                  path: packages/client/dist/*.map
                  if-no-files-found: error

            - name: Publish bundles to builds branch
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail

                  dist="$(pwd)/packages/client/dist"
                  publish="$(mktemp -d)"
                  remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

                  git worktree add --detach "$publish"
                  cd "$publish"

                  git checkout --orphan builds
                  git reset --hard

                  cp -r "$dist"/. .
                  find . -name '*.map' -not -path './.git/*' -delete

                  if git fetch --depth 1 "$remote" builds:refs/remotes/publish/builds; then
                      git checkout refs/remotes/publish/builds -- repo 2>/dev/null || true
                  fi

                  echo 'builds.unbound.rip' > CNAME

                  git add -A
                  git commit -m "build: publish bundles for ${GITHUB_SHA}"

                  git push --force "$remote" builds

            - name: Note the unconfigured public bucket
              if: ${{ vars.S3_PUBLIC_BUCKET == '' }}
              run: echo "The public bucket is not configured (vars S3_ENDPOINT, S3_REGION, S3_PUBLIC_BUCKET; secrets S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY), so the bucket upload is skipped." >> "$GITHUB_STEP_SUMMARY"

            - name: Upload bundles to the public bucket
              if: ${{ vars.S3_PUBLIC_BUCKET != '' }}
              run: bun run --cwd packages/client upload
              env:
                  UNBOUND_CHANNEL: beta
                  UNBOUND_VERSION: ${{ github.sha }}
                  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
                  S3_REGION: ${{ vars.S3_REGION }}
                  S3_PUBLIC_BUCKET: ${{ vars.S3_PUBLIC_BUCKET }}
                  S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
                  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

            # Records the oldest loader this bundle runs on, so the update check tells older loaders to update.
            - name: Record the bundle's minimum loader
              if: ${{ vars.UNBOUND_API_URL != '' }}
              env:
                  UNBOUND_API_KEY: ${{ secrets.UNBOUND_API_KEY }}
                  UNBOUND_API_URL: ${{ vars.UNBOUND_API_URL }}
                  UNBOUND_CHANNEL: beta
                  UNBOUND_VERSION: ${{ github.sha }}
              run: |
                  set -euo pipefail
                  : "${UNBOUND_API_KEY:?UNBOUND_API_KEY is required to record the bundle}"
                  jq -n \
                      --arg channel "$UNBOUND_CHANNEL" \
                      --arg version "$UNBOUND_VERSION" \
                      --arg minLoaderVersion "$(jq -r '.minLoaderVersion' packages/client/dist/manifest.json)" \
                      '{channel: $channel, version: $version, minLoaderVersion: $minLoaderVersion}' \
                  | curl --fail-with-body --silent --show-error --request POST \
                      --header 'Content-Type: application/json' \
                      --header "X-API-Key: $UNBOUND_API_KEY" \
                      --data @- \
                      "${UNBOUND_API_URL%/}/api/v1/loader/bundles"
