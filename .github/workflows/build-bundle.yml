name: Build Bundle

# Unbound has one bundle channel: each push to main publishes to builds.unbound.rip, which every loader reads,
# and to the public bucket under `unbound/beta/{sha}/`. The channel keeps the name `beta` because loaders pin
# the manifest's channel against rollback. Versions are immutable; a version that is already published is
# skipped, never overwritten. A bundle whose `minLoaderVersion` no published loader or Android release meets
# fails before anything is published; loader-release-poll.yml runs this again once those releases ship.
#
# A build whose manifest `contentHash` matches the published one changes nothing users run, so it is not published.
# Clients toast a staged update only when the manifest's `importantAt` is newer than the bundle they run: a commit
# with an `Important-Update: <reason>` line in its message, or a manual run with `important`, moves it to now. The
# line is matched anywhere, not as a git trailer: squash merges join commit bodies, which buries trailers mid-message.
#
# Configure in the repository settings:
#   vars:    S3_ENDPOINT, S3_REGION, S3_PUBLIC_BUCKET
#   secrets: S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY
#   vars:    UNBOUND_API_URL and secrets: UNBOUND_API_KEY, to record each bundle's minimum loader

on:
    workflow_dispatch:
        inputs:
            important:
                description: Prompt users to restart for this build
                type: boolean
                default: false
    push:
        branches:
            - main
        paths:
            - packages/client/src/**
            - packages/loader/core/src/LoaderBundlePatch.cpp
            - packages/client/scripts/build/**
            - packages/rollup-plugin-hermes/src/**
    repository_dispatch:
        types:
            - hermesc-published

permissions:
    contents: write
    actions: read

jobs:
    build:
        runs-on: ubuntu-26.04
        timeout-minutes: 15
        # A later push replaces a build in flight.
        concurrency:
            group: build-bundle
            cancel-in-progress: true
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            # bun.lock is lockfileVersion 2, which stable bun cannot parse until 1.4 releases.
            # canary's frozen-lockfile check fails on a self-generated lockfile (round-trip bug),
            # so install without it until stable 1.4 lands.
            - name: Setup Bun dependencies
              uses: ./.github/actions/setup-bun-deps

            # Loaders patch their bundle from any of these earlier builds instead of downloading it whole.
            - name: List the earlier builds to patch from
              id: patch-bases
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  revisions="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-bundle.yml --branch main --status success --limit 8 --json headSha --jq '[.[].headSha] | join(",")' || true)"
                  echo "revisions=$revisions" >> "$GITHUB_OUTPUT"

            - name: Read the published manifest
              id: published
              env:
                  IMPORTANT_INPUT: ${{ inputs.important }}
              run: |
                  set -euo pipefail
                  manifest="$RUNNER_TEMP/published-manifest.json"
                  curl --fail --silent --show-error --location --retry 3 https://builds.unbound.rip/manifest.json -o "$manifest" \
                      || echo '{}' > "$manifest"
                  revision="$(jq -r '.revision // ""' "$manifest")"

                  # Every commit since the published build, or this one alone when that build's revision is unknown here.
                  range=HEAD~1..HEAD
                  if [ -n "$revision" ] && git rev-parse --quiet --verify "$revision^{commit}" > /dev/null; then
                      range="$revision..HEAD"
                  fi
                  trailers="$(git log --format=%B "$range" -- | grep -E '^[*[:space:]]*Important-Update:[[:space:]]*[^[:space:]]' || true)"

                  if [ "$IMPORTANT_INPUT" = true ] || [ -n "$trailers" ]; then
                      important_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                      echo "This build prompts users to restart." >> "$GITHUB_STEP_SUMMARY"
                  else
                      important_at="$(jq -r '.importantAt // ""' "$manifest")"
                  fi

                  # The content hash covers bytecode through its JavaScript, so compiler and build tooling changes always publish.
                  tooling_changed="$(git diff --name-only "${range%%..*}" HEAD -- \
                      packages/client/scripts/build packages/rollup-plugin-hermes/src packages/loader/core/src/LoaderBundlePatch.cpp)"

                  {
                      echo "content-hash=$(jq -r '.contentHash // ""' "$manifest")"
                      echo "important-at=$important_at"
                      echo "tooling-changed=$([ -n "$tooling_changed" ] && echo true || echo false)"
                  } >> "$GITHUB_OUTPUT"

            - name: Build the loader's bundle patch checker
              run: packages/loader/core/tools/build-bundle-patch-check.sh "$RUNNER_TEMP/bundle_patch_check"

            - name: Build the client
              run: bun run --cwd packages/client build
              env:
                  TMPDIR: ${{ runner.temp }}
                  UNBOUND_CHANNEL: beta
                  UNBOUND_IMPORTANT_AT: ${{ steps.published.outputs.important-at }}
                  UNBOUND_BUNDLE_SIGNING_KEY: ${{ secrets.UNBOUND_BUNDLE_SIGNING_KEY }}
                  UNBOUND_PATCH_BASE_URL: ${{ vars.CDN_URL && format('{0}/unbound/beta', vars.CDN_URL) || '' }}
                  UNBOUND_PATCH_REVISIONS: ${{ steps.patch-bases.outputs.revisions }}
                  UNBOUND_PATCH_VERIFIER: ${{ runner.temp }}/bundle_patch_check

            - name: Check whether the build changes what users run
              id: changed
              env:
                  PUBLISHED_HASH: ${{ steps.published.outputs.content-hash }}
                  # A new hermesc or build tooling change can alter bytecode alone, which the content hash does not see.
                  ALWAYS_PUBLISH: ${{ github.event_name != 'push' || steps.published.outputs.tooling-changed == 'true' }}
              run: |
                  set -euo pipefail
                  built="$(jq -r '.contentHash' packages/client/dist/manifest.json)"
                  if [ "$ALWAYS_PUBLISH" != true ] && [ -n "$PUBLISHED_HASH" ] && [ "$built" = "$PUBLISHED_HASH" ]; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                      echo "The bundles match the published ones apart from their revision, so nothing is published." >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Check every bundle and the manifest are signed
              run: bun run --cwd packages/client verify-signatures

            # The loader downloads the DevTools backend for `loader.devtools` by the manifest's hash.
            - name: Check the DevTools backend is built for every bytecode version
              run: |
                  for version in $(jq -r '.bytecodeVersions[]' packages/client/scripts/build/hermes.json); do
                      jq -e --arg file "devtools.$version.bundle" '.sha512[$file]' packages/client/dist/manifest.json > /dev/null \
                          || { echo "::error::manifest.json lists no devtools.$version.bundle"; exit 1; }
                  done

            - name: Check every bundle has a source map
              run: |
                  for bundle in packages/client/dist/unbound.*.bundle; do
                      test -f "$bundle.map" || { echo "::error::$bundle has no source map"; exit 1; }
                  done

            # A bundle that needs a loader no one can install yet would leave users unable to update.
            - name: Check a published loader runs the bundle
              if: ${{ vars.UNBOUND_API_URL != '' }}
              env:
                  UNBOUND_API_URL: ${{ vars.UNBOUND_API_URL }}
              run: |
                  set -euo pipefail
                  required="$(jq -r '.minLoaderVersion' packages/client/dist/manifest.json)"
                  for platform in ios android; do
                      newest="$(curl --fail-with-body --silent --show-error \
                          "${UNBOUND_API_URL%/}/api/v1/loader/updates?platform=$platform&version=0.0.0" \
                          | jq -r '.update.version // "none"')"
                      if [ "$newest" = none ] || [ "$(printf '%s\n%s\n' "$required" "$newest" | sort -V | head -n 1)" != "$required" ]; then
                          echo "::error::The bundle needs loader $required, but the newest published $platform loader is $newest. Release the loader first; its publish runs this again."
                          exit 1
                      fi
                  done

            # Obtainium installs each channel's newest Android release by date, so each must carry a loader that runs the bundle.
            - name: Check every Android release runs the bundle
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  required="$(jq -r '.minLoaderVersion' packages/client/dist/manifest.json)"
                  releases="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --exclude-drafts --json name,publishedAt)"
                  for track in 'Android' 'Android beta' 'Android alpha'; do
                      newest="$(jq -r --arg track "$track" '
                          [.[] | select(.name | test("^Unbound .+ for Discord [0-9]+\\.[0-9]+, " + $track + "$"))]
                          | (max_by(.publishedAt) // {}).name // ""
                          | (capture("^Unbound (?<version>[^ ]+) ").version // "none")' <<< "$releases")"
                      if [ "$newest" = none ] || [ "$(printf '%s\n%s\n' "$required" "$newest" | sort -V | head -n 1)" != "$required" ]; then
                          echo "::error::The bundle needs loader $required, but the newest $track release carries loader $newest. The release poll rebuilds it once the loader is published, then runs this again."
                          exit 1
                      fi
                  done

            - name: Keep source maps
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: source-maps-${{ github.sha }}
                  path: packages/client/dist/*.map
                  if-no-files-found: error

            - name: Publish bundles to builds branch
              if: steps.changed.outputs.changed == 'true'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail

                  dist="$(pwd)/packages/client/dist"
                  publish="$(mktemp -d)"
                  remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

                  git worktree add --detach "$publish"
                  cd "$publish"

                  git checkout --orphan builds
                  git reset --hard

                  cp -r "$dist"/. .
                  find . -name '*.map' -not -path './.git/*' -delete

                  if git fetch --depth 1 "$remote" builds:refs/remotes/publish/builds; then
                      git checkout refs/remotes/publish/builds -- repo 2>/dev/null || true
                  fi

                  echo 'builds.unbound.rip' > CNAME

                  git add -A
                  git commit -m "build: publish bundles for ${GITHUB_SHA}"

                  git push --force "$remote" builds

            - name: Note the unconfigured public bucket
              if: ${{ vars.S3_PUBLIC_BUCKET == '' }}
              run: echo "The public bucket is not configured (vars S3_ENDPOINT, S3_REGION, S3_PUBLIC_BUCKET; secrets S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY), so the bucket upload is skipped." >> "$GITHUB_STEP_SUMMARY"

            - name: Upload bundles to the public bucket
              if: ${{ vars.S3_PUBLIC_BUCKET != '' && steps.changed.outputs.changed == 'true' }}
              run: bun run --cwd packages/client upload
              env:
                  UNBOUND_CHANNEL: beta
                  UNBOUND_VERSION: ${{ github.sha }}
                  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
                  S3_REGION: ${{ vars.S3_REGION }}
                  S3_PUBLIC_BUCKET: ${{ vars.S3_PUBLIC_BUCKET }}
                  S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
                  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

            # Records the oldest loader this bundle runs on, so the update check tells older loaders to update.
            - name: Record the bundle's minimum loader
              if: ${{ vars.UNBOUND_API_URL != '' && steps.changed.outputs.changed == 'true' }}
              env:
                  UNBOUND_API_KEY: ${{ secrets.UNBOUND_API_KEY }}
                  UNBOUND_API_URL: ${{ vars.UNBOUND_API_URL }}
                  UNBOUND_CHANNEL: beta
                  UNBOUND_VERSION: ${{ github.sha }}
              run: |
                  set -euo pipefail
                  : "${UNBOUND_API_KEY:?UNBOUND_API_KEY is required to record the bundle}"
                  jq -n \
                      --arg channel "$UNBOUND_CHANNEL" \
                      --arg version "$UNBOUND_VERSION" \
                      --arg minLoaderVersion "$(jq -r '.minLoaderVersion' packages/client/dist/manifest.json)" \
                      '{channel: $channel, version: $version, minLoaderVersion: $minLoaderVersion}' \
                  | curl --fail-with-body --silent --show-error --request POST \
                      --header 'Content-Type: application/json' \
                      --header "X-API-Key: $UNBOUND_API_KEY" \
                      --data @- \
                      "${UNBOUND_API_URL%/}/api/v1/loader/bundles"
