name: Build Bundle

# Every build is uploaded to the public bucket under `unbound/{channel}/{version}/`, served through
# the CDN: pushes to main publish to `beta` as the commit SHA, client releases (called from
# release.yml) publish to `stable` as the client version. Versions are immutable; a version that is already
# published is skipped, never overwritten.
#
# Configure in the repository settings:
#   vars:    S3_ENDPOINT, S3_REGION, S3_PUBLIC_BUCKET
#   secrets: S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - packages/client/src/**
            - packages/client/scripts/build/**
    repository_dispatch:
        types:
            - rollup-plugin-updated
            - hermesc-published
    workflow_call:
        inputs:
            version:
                description: The client release version to publish to the stable channel.
                type: string
                required: true
        secrets:
            S3_ACCESS_KEY_ID:
                required: true
            S3_SECRET_ACCESS_KEY:
                required: true
            UNBOUND_BUNDLE_SIGNING_KEY:
                required: true

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-26.04
        timeout-minutes: 15
        # A release upload must never be cancelled by a later push.
        concurrency:
            group: build-bundle-${{ inputs.version || 'beta' }}
            cancel-in-progress: ${{ !inputs.version }}
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: ${{ inputs.version && format('client-v{0}', inputs.version) || '' }}
                  fetch-depth: 0
                  persist-credentials: false

            # bun.lock is lockfileVersion 2, which stable bun cannot parse until 1.4 releases.
            # canary's frozen-lockfile check fails on a self-generated lockfile (round-trip bug),
            # so install without it until stable 1.4 lands.
            - name: Setup Bun dependencies
              uses: ./.github/actions/setup-bun-deps
              with:
                  bun-version: canary

            - name: Build the client
              run: bun run --cwd packages/client build
              env:
                  TMPDIR: ${{ runner.temp }}
                  UNBOUND_BUNDLE_SIGNING_KEY: ${{ secrets.UNBOUND_BUNDLE_SIGNING_KEY }}

            - name: Check every bundle is signed
              run: bun run --cwd packages/client verify-signatures

            - name: Check every bundle has a source map
              run: |
                  for bundle in packages/client/dist/unbound.*.bundle; do
                      test -f "$bundle.map" || { echo "::error::$bundle has no source map"; exit 1; }
                  done

            - name: Keep source maps
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: source-maps-${{ inputs.version || github.sha }}
                  path: packages/client/dist/*.map
                  if-no-files-found: error

            - name: Publish bundles to builds branch
              if: ${{ !inputs.version }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail

                  dist="$(pwd)/packages/client/dist"
                  publish="$(mktemp -d)"
                  remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

                  git worktree add --detach "$publish"
                  cd "$publish"

                  git checkout --orphan builds
                  git reset --hard

                  cp -r "$dist"/. .
                  find . -name '*.map' -not -path './.git/*' -delete

                  if git fetch --depth 1 "$remote" builds:refs/remotes/publish/builds; then
                      git checkout refs/remotes/publish/builds -- repo 2>/dev/null || true
                  fi

                  echo 'builds.unbound.rip' > CNAME

                  git add -A
                  git commit -m "build: publish bundles for ${GITHUB_SHA}"

                  git push --force "$remote" builds

            - name: Note the unconfigured public bucket
              if: ${{ vars.S3_PUBLIC_BUCKET == '' }}
              run: echo "The public bucket is not configured (vars S3_ENDPOINT, S3_REGION, S3_PUBLIC_BUCKET; secrets S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY), so the bucket upload is skipped." >> "$GITHUB_STEP_SUMMARY"

            - name: Upload bundles to the public bucket
              if: ${{ vars.S3_PUBLIC_BUCKET != '' }}
              run: bun run --cwd packages/client upload
              env:
                  UNBOUND_CHANNEL: ${{ inputs.version && 'stable' || 'beta' }}
                  UNBOUND_VERSION: ${{ inputs.version || github.sha }}
                  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
                  S3_REGION: ${{ vars.S3_REGION }}
                  S3_PUBLIC_BUCKET: ${{ vars.S3_PUBLIC_BUCKET }}
                  S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
                  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
