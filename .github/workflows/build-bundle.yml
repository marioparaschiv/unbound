name: Build Bundle

# Every build is uploaded to the public bucket under `unbound/{channel}/{version}/`, served through
# the CDN: pushes to main publish to `beta` as the commit SHA, releases (called from release.yml)
# publish to `stable` as the release version. Versions are immutable; a version that is already
# published is skipped, never overwritten.
#
# Configure in the repository settings:
#   vars:    S3_ENDPOINT, S3_REGION, S3_PUBLIC_BUCKET
#   secrets: S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - packages/client/src/**
            - packages/client/scripts/build/**
    repository_dispatch:
        types:
            - rollup-plugin-updated
            - hermesc-published
    workflow_call:
        inputs:
            version:
                description: The release version to publish to the stable channel.
                type: string
                required: true
        secrets:
            S3_ACCESS_KEY_ID:
                required: true
            S3_SECRET_ACCESS_KEY:
                required: true

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        # A release upload must never be cancelled by a later push.
        concurrency:
            group: build-bundle-${{ inputs.version || 'beta' }}
            cancel-in-progress: ${{ !inputs.version }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.version && format('v{0}', inputs.version) || '' }}
                  fetch-depth: 0
                  persist-credentials: false

            # bun.lock is lockfileVersion 2, which stable bun cannot parse until 1.4 releases.
            # canary's frozen-lockfile check fails on a self-generated lockfile (round-trip bug),
            # so install without it until stable 1.4 lands.
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: canary

            - run: bun install

            - run: bun run --cwd packages/client build

            - name: Check every bundle has a source map
              run: |
                  for bundle in packages/client/dist/unbound.*.bundle; do
                      test -f "$bundle.map" || { echo "::error::$bundle has no source map"; exit 1; }
                  done

            - name: Keep source maps
              uses: actions/upload-artifact@v4
              with:
                  name: source-maps-${{ inputs.version || github.sha }}
                  path: packages/client/dist/*.map
                  if-no-files-found: error

            - name: Publish bundles to builds branch
              if: ${{ !inputs.version }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail

                  dist="$(pwd)/packages/client/dist"
                  publish="$(mktemp -d)"

                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

                  git worktree add --detach "$publish"
                  cd "$publish"

                  git checkout --orphan builds
                  git reset --hard

                  cp -r "$dist"/. .
                  find . -name '*.map' -not -path './.git/*' -delete

                  echo 'builds.unbound.rip' > CNAME

                  git add -A
                  git commit -m "build: publish bundles for ${GITHUB_SHA}"

                  remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
                  git push --force "$remote" builds

            - name: Upload bundles to the public bucket
              run: bun run --cwd packages/client upload
              env:
                  UNBOUND_CHANNEL: ${{ inputs.version && 'stable' || 'beta' }}
                  UNBOUND_VERSION: ${{ inputs.version || github.sha }}
                  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
                  S3_REGION: ${{ vars.S3_REGION }}
                  S3_PUBLIC_BUCKET: ${{ vars.S3_PUBLIC_BUCKET }}
                  S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
                  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
