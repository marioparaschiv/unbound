name: DevTools

# Pull requests that touch the devtools run the checks. Release binaries are built only when
# release.yml releases the devtools component (or by hand for an existing tag): they are attached
# to devtools-v{version} and to the rolling devtools-latest release the README links to, then
# registered with the API (vars.UNBOUND_API_URL, secrets.UNBOUND_API_KEY) so the app's updater offers them.
#
# Caching: rust-cache keys each job by target, rustc version, Cargo.lock and the manifests, and
# keeps only dependency artifacts (workspace crates rebuild anyway).
on:
    pull_request:
        paths:
            - 'apps/devtools/**'
            # The bridge client's contract tests read the protocol's fixture.
            - 'packages/debugger-protocol/**'
            - '.github/workflows/devtools.yml'
    workflow_call:
        inputs:
            version:
                description: The devtools release version to build and attach binaries to.
                type: string
                required: true
        secrets:
            UNBOUND_API_KEY:
                required: false
    workflow_dispatch:
        inputs:
            version:
                description: An existing devtools release version (without the devtools-v prefix) to rebuild and publish.
                type: string
                required: false
            ref:
                description: A branch or commit to build as downloadable artifacts only, publishing nothing.
                type: string
                required: false

permissions:
    contents: read

# A newer push cancels a pull request's checks; a release build is never cancelled.
concurrency:
    group: devtools-${{ inputs.version || inputs.ref || github.ref }}
    cancel-in-progress: ${{ !inputs.version }}

env:
    CARGO_TERM_COLOR: always
    CARGO_NET_RETRY: 10
    # Incremental artifacts are large, rarely reused on a fresh runner, and bloat the cache.
    CARGO_INCREMENTAL: 0
    LINUX_BUILD_DEPS: >-
        pkg-config libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev
        libxcb1-dev libx11-xcb-dev libwayland-dev

defaults:
    run:
        working-directory: apps/devtools

jobs:
    check:
        name: Check (${{ matrix.os }})
        if: ${{ !inputs.version && !inputs.ref }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 40
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-26.04, macos-26, windows-2025]
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 1
                  persist-credentials: false

            - name: Install Linux build dependencies
              if: runner.os == 'Linux'
              run: |
                  read -ra deps <<< "$LINUX_BUILD_DEPS"
                  sudo apt-get update
                  sudo apt-get install -y "${deps[@]}"

            - name: Install Rust
              uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
              with:
                  toolchain: stable
                  components: clippy, rustfmt

            - name: Cache cargo
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
              with:
                  workspaces: apps/devtools -> target
                  key: check

            - name: Set up Bun
              if: runner.os == 'Linux'
              uses: ./.github/actions/setup-bun-deps
              with:
                  install: 'false'

            - name: Install harness dependencies
              if: runner.os == 'Linux'
              working-directory: apps/devtools/harness
              run: bun install --frozen-lockfile

            - name: Format
              if: runner.os == 'Linux'
              run: cargo fmt --check

            # clippy and test share the debug profile, so test reuses clippy's dependency builds.
            - name: Clippy
              run: cargo clippy --locked --workspace --all-targets -- -D warnings

            - name: Test
              run: cargo test --locked --workspace

    build:
        name: Build (${{ matrix.target }})
        if: ${{ inputs.version || inputs.ref }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 40
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Linux builds on 22.04 so the binary needs only glibc 2.35 and runs on older distros.
                    - os: ubuntu-22.04
                      target: x86_64-unknown-linux-gnu
                      asset: unbound-devtools-linux-x64.tar.gz
                    - os: ubuntu-22.04-arm
                      target: aarch64-unknown-linux-gnu
                      asset: unbound-devtools-linux-arm64.tar.gz
                    - os: macos-26
                      target: aarch64-apple-darwin
                      asset: unbound-devtools-macos-arm64.tar.gz
                    - os: windows-2025
                      target: x86_64-pc-windows-msvc
                      asset: unbound-devtools-windows-x64.zip
                    - os: windows-11-arm
                      target: aarch64-pc-windows-msvc
                      asset: unbound-devtools-windows-arm64.zip
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: ${{ inputs.ref || format('devtools-v{0}', inputs.version) }}
                  fetch-depth: 1
                  persist-credentials: false

            - name: Install Linux build dependencies
              if: runner.os == 'Linux'
              run: |
                  read -ra deps <<< "$LINUX_BUILD_DEPS"
                  sudo apt-get update
                  sudo apt-get install -y "${deps[@]}"

            - name: Install Rust
              uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
              with:
                  toolchain: stable
                  targets: ${{ matrix.target }}

            - name: Cache cargo
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
              with:
                  workspaces: apps/devtools -> target
                  key: release-${{ matrix.target }}

            - name: Build release
              run: cargo build --locked --release -p unbound-devtools --target ${{ matrix.target }}

            # tar keeps the executable bit on Linux and macOS; Windows users expect a zip.
            - name: Package binary (Linux)
              if: runner.os == 'Linux'
              working-directory: apps/devtools/target/${{ matrix.target }}/release
              run: tar -czf '${{ matrix.asset }}' unbound-devtools

            # A .app gives the app its Dock name and icon. Ad-hoc signed so the bundle's seal holds; the
            # updater swaps the whole bundle. actool compiles the Icon Composer icon into Assets.car, which
            # macOS 26 draws per appearance (the bare glyph in dark mode), and an AppIcon.icns for older macOS.
            - name: Package app (macOS)
              if: runner.os == 'macOS'
              working-directory: apps/devtools/target/${{ matrix.target }}/release
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  version=${VERSION:-$(sed -n 's/^version = "\(.*\)"/\1/p' "$GITHUB_WORKSPACE/apps/devtools/Cargo.toml" | head -1)}
                  app='Unbound DevTools.app'
                  mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
                  cp unbound-devtools "$app/Contents/MacOS/"
                  catalog="$RUNNER_TEMP/Empty.xcassets"
                  mkdir -p "$catalog"
                  echo '{"info":{"author":"xcode","version":1}}' > "$catalog/Contents.json"
                  xcrun actool "$GITHUB_WORKSPACE/apps/devtools/assets/AppIcon.icon" "$catalog" \
                      --compile "$app/Contents/Resources" \
                      --output-format human-readable-text --notices --warnings \
                      --output-partial-info-plist "$RUNNER_TEMP/AppIcon.plist" \
                      --app-icon AppIcon \
                      --enable-on-demand-resources NO \
                      --development-region en \
                      --target-device mac \
                      --minimum-deployment-target 11.0 \
                      --platform macosx
                  test -f "$app/Contents/Resources/Assets.car"
                  test -f "$app/Contents/Resources/AppIcon.icns"
                  cat > "$app/Contents/Info.plist" <<EOF
                  <?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0">
                  <dict>
                      <key>CFBundleName</key><string>Unbound DevTools</string>
                      <key>CFBundleDisplayName</key><string>Unbound DevTools</string>
                      <key>CFBundleIdentifier</key><string>rip.unbound.devtools</string>
                      <key>CFBundleExecutable</key><string>unbound-devtools</string>
                      <key>CFBundleIconFile</key><string>AppIcon</string>
                      <key>CFBundleIconName</key><string>AppIcon</string>
                      <key>CFBundlePackageType</key><string>APPL</string>
                      <key>CFBundleShortVersionString</key><string>$version</string>
                      <key>CFBundleVersion</key><string>$version</string>
                      <key>LSApplicationCategoryType</key><string>public.app-category.developer-tools</string>
                      <key>NSHighResolutionCapable</key><true/>
                  </dict>
                  </plist>
                  EOF
                  plutil -lint "$app/Contents/Info.plist"
                  codesign --force --deep --sign - "$app"
                  tar -czf '${{ matrix.asset }}' "$app"

            - name: Package binary (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              working-directory: apps/devtools/target/${{ matrix.target }}/release
              run: Compress-Archive -Path unbound-devtools.exe -DestinationPath '${{ matrix.asset }}'

            - name: Upload binary
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: ${{ matrix.asset }}
                  path: apps/devtools/target/${{ matrix.target }}/release/${{ matrix.asset }}
                  if-no-files-found: error

    publish:
        name: Publish v${{ inputs.version }}
        needs: build
        if: ${{ inputs.version }}
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            contents: write
        defaults:
            run:
                working-directory: .
        steps:
            - name: Download binaries
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
              with:
                  path: release-assets
                  merge-multiple: true

            - name: Attach binaries to the release
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ inputs.version }}
              run: gh release upload "devtools-v$VERSION" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber

            # The repository's "latest" release is whichever package released last, so the README
            # links to a devtools-only alias instead, as loader-latest does for the loader.
            - name: Refresh the rolling devtools-latest release
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/devtools-v$VERSION" --jq .sha)
                  gh release delete devtools-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
                  gh release create devtools-latest \
                    --repo "$GITHUB_REPOSITORY" \
                    --target "$sha" \
                    --title 'Unbound DevTools (latest)' \
                    --notes "The most recent devtools release, currently devtools-v$VERSION." \
                    --latest=false \
                    release-assets/*

            # Registers the release so `GET /api/v1/devtools/updates` offers it; each asset carries the
            # archive's SHA-256, which the app checks before it replaces itself. Posting again is safe.
            - name: Register the release with the API
              if: ${{ vars.UNBOUND_API_URL != '' }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  UNBOUND_API_KEY: ${{ secrets.UNBOUND_API_KEY }}
                  UNBOUND_API_URL: ${{ vars.UNBOUND_API_URL }}
                  VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  : "${UNBOUND_API_KEY:?UNBOUND_API_KEY is required to register the release}"
                  base="https://github.com/$GITHUB_REPOSITORY/releases/download/devtools-v$VERSION"
                  assets='[]'
                  for file in release-assets/*; do
                      name=$(basename "$file")
                      # unbound-devtools-<os>-<arch>.<ext> -> <os>-<arch>, the API's target.
                      target=${name#unbound-devtools-}
                      target=${target%.tar.gz}
                      target=${target%.zip}
                      sha=$(sha256sum "$file" | cut -d' ' -f1)
                      assets=$(jq -c --arg target "$target" --arg url "$base/$name" --arg sha "$sha" \
                          '. + [{target: $target, url: $url, sha256: $sha}]' <<< "$assets")
                  done
                  notes=$(gh release view "devtools-v$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
                  jq -n \
                      --arg version "$VERSION" \
                      --arg notes "$notes" \
                      --argjson assets "$assets" \
                      '{version: $version, assets: $assets, changelog: (if $notes == "" then null else $notes[0:10000] end)}' \
                  | curl --fail-with-body --silent --show-error --request POST \
                      --header 'Content-Type: application/json' \
                      --header "X-API-Key: $UNBOUND_API_KEY" \
                      --data @- \
                      "${UNBOUND_API_URL%/}/api/v1/devtools/releases"
