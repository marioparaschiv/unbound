name: DevTools

on:
    pull_request:
        paths:
            - 'apps/devtools/**'
            - 'packages/loader/bootstrap/devtools.js'
            - '.github/workflows/devtools.yml'
    push:
        branches: [main]
        paths:
            - 'apps/devtools/**'
            - 'packages/loader/bootstrap/devtools.js'
            - '.github/workflows/devtools.yml'

permissions:
    contents: read

concurrency:
    group: devtools-${{ github.ref }}
    cancel-in-progress: true

defaults:
    run:
        working-directory: apps/devtools

jobs:
    build:
        name: Build (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 40
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-26.04, macos-26, windows-2025]
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 1

            - name: Install Linux build dependencies
              if: runner.os == 'Linux'
              run: >
                  sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig-dev
                  libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev
                  libwayland-dev

            - name: Install Rust
              run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable

            - name: Cache cargo
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      apps/devtools/target
                  key: devtools-${{ runner.os }}-${{ hashFiles('apps/devtools/Cargo.lock') }}

            - name: Set up Bun
              if: runner.os == 'Linux'
              uses: ./.github/actions/setup-bun-deps
              with:
                  install: 'false'

            - name: Install harness dependencies
              if: runner.os == 'Linux'
              working-directory: apps/devtools/harness
              run: bun install --frozen-lockfile

            - name: Clippy
              run: cargo clippy --workspace --all-targets -- -D warnings

            - name: Test
              run: cargo test --workspace

            - name: Build release
              run: cargo build --release -p unbound-devtools

            - name: Upload binary
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: unbound-devtools-${{ runner.os }}
                  path: |
                      apps/devtools/target/release/unbound-devtools
                      apps/devtools/target/release/unbound-devtools.exe
                  if-no-files-found: error
