name: Loader Build Android

on:
    workflow_dispatch:
        inputs:
            ios_version:
                description: 'Discord app version to match'
                required: false
                type: string
            require_matching_version:
                description: 'Fail instead of using a different Android version'
                required: false
                default: false
                type: boolean
            release:
                description: 'Require persistent Android release signing'
                required: false
                default: false
                type: boolean
            discord_channel:
                description: 'Discord Android channel to patch'
                required: false
                default: stable
                type: choice
                options: [stable, beta, alpha]
            android_code:
                description: 'Exact Discord Android version code to patch'
                required: false
                type: string
    workflow_call:
        inputs:
            ios_version:
                description: 'Discord app version to match'
                required: false
                type: string
            require_matching_version:
                description: 'Fail instead of using a different Android version'
                required: false
                default: false
                type: boolean
            release:
                description: 'Require persistent Android release signing'
                required: false
                default: false
                type: boolean
            discord_channel:
                description: 'Discord Android channel to patch'
                required: false
                default: stable
                type: string
            android_code:
                description: 'Exact Discord Android version code to patch'
                required: false
                type: string
            pr_number:
                description: 'Pull request whose test bundles this build trusts the PR bundle key for'
                required: false
                default: ''
                type: string
        outputs:
            module_filename:
                description: 'Filename of the LSPosed module APK'
                value: ${{ jobs.build-module.outputs.module_filename }}
            module_url:
                description: 'Download URL for the LSPosed module APK artifact'
                value: ${{ jobs.build-module.outputs.module_url }}
            patched_filename:
                description: 'Filename of the LSPatch-patched Discord split APKs'
                value: ${{ jobs.patch-discord.outputs.patched_filename }}
            patched_url:
                description: 'Download URL for the LSPatch-patched Discord artifact'
                value: ${{ jobs.patch-discord.outputs.patched_url }}

permissions:
    contents: read

concurrency:
    group: android-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

defaults:
    run:
        working-directory: packages/loader

jobs:
    core-tests:
        name: Shared core tests
        runs-on: ubuntu-26.04
        timeout-minutes: 6
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 1

            - name: Configure core
              run: cmake -S core -B build/core -DUNBOUND_CORE_TESTS=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined"

            - name: Build core
              run: cmake --build build/core -j"$(nproc)"

            - name: Run core tests
              run: ctest --test-dir build/core --output-on-failure

    native-jsi-fuzz:
        name: Host Hermes bridge tests and fuzzing
        runs-on: ubuntu-26.04
        timeout-minutes: 40
        env:
            HERMES_TAG: hermes-v250829098.0.14
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 1

            - name: Fetch Hermes
              run: git clone --depth 1 --branch "$HERMES_TAG" https://github.com/facebook/hermes.git build/hermes-src

            - name: Check Hermes matches the vendored JSI
              run: cmp vendor/react/jsi/jsi.h build/hermes-src/API/jsi/jsi/jsi.h

            - name: Cache the Hermes build
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
              with:
                  path: packages/loader/build/jsi-fuzz
                  key: jsi-fuzz-${{ runner.os }}-${{ env.HERMES_TAG }}-${{ hashFiles('packages/loader/core/**') }}
                  restore-keys: jsi-fuzz-${{ runner.os }}-${{ env.HERMES_TAG }}-

            - name: Install libffi
              run: sudo apt-get install -y -qq libffi-dev

            - name: Configure the fuzzer
              run: cmake -S core -B build/jsi-fuzz -DUNBOUND_CORE_TESTS=ON -DUNBOUND_CORE_JSI_FUZZ=ON -DUNBOUND_HERMES_SOURCE_DIR="$PWD/build/hermes-src" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_FLAGS="-fsanitize=address,undefined" -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"

            - name: Build the Hermes tests and fuzzer
              run: cmake --build build/jsi-fuzz --target native_platform_hermes native_runtime_hermes native_preload_hermes native_jsi_fuzz -j"$(nproc)"

            - name: Test the native bridge on Hermes
              run: |
                  build/jsi-fuzz/native_platform_hermes
                  build/jsi-fuzz/native_preload_hermes
                  build/jsi-fuzz/native_runtime_hermes | tee runtime.log
                  grep -q "FFI included" runtime.log

            - name: Fuzz
              env:
                  UNBOUND_FUZZ_ITERATIONS: '20000'
              run: build/jsi-fuzz/native_jsi_fuzz

    native-bridge-fuzz:
        name: Fuzz the native bridge
        runs-on: ubuntu-26.04
        timeout-minutes: 8
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 1

            - name: Configure the fuzzer
              run: cmake -S core -B build/fuzz -DUNBOUND_CORE_FUZZ=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_FLAGS="-fsanitize=fuzzer-no-link,address,undefined" -DCMAKE_CXX_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -fno-sanitize-recover=all"

            - name: Build the fuzzer
              run: cmake --build build/fuzz --target native_bridge_libfuzzer -j"$(nproc)"

            - name: Fuzz for a minute
              run: build/fuzz/native_bridge_libfuzzer -max_total_time=60 -max_len=4096 -artifact_prefix=build/fuzz/

            - name: Upload crashing inputs
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: native bridge fuzz crashes
                  path: packages/loader/build/fuzz/crash-*
                  retention-days: ${{ github.event_name == 'pull_request' && 14 || 0 }}

    build-module:
        name: Build LSPosed module
        runs-on: ubuntu-26.04
        timeout-minutes: 12
        env:
            ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
            ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
            ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
            ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
            UNBOUND_PR_NUMBER: ${{ inputs.pr_number || '' }}
        outputs:
            module_filename: ${{ steps.collect.outputs.module_filename }}
            module_url: ${{ steps.upload-module.outputs.artifact-url }}
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  submodules: recursive
                  fetch-depth: 1

            - name: Setup Java
              uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
              with:
                  distribution: temurin
                  java-version: '17'

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

            - name: Install NDK and CMake
              run: |
                  set -eu
                  yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
                  "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0" > /dev/null

            - name: Configure persistent release signing
              env:
                  REQUIRE_RELEASE_SIGNING: ${{ inputs.release }}
              run: |
                  set -euo pipefail
                  if [ -z "$ANDROID_SIGNING_KEYSTORE_BASE64" ]; then
                      if [ "$REQUIRE_RELEASE_SIGNING" = true ]; then
                          echo "::error::Android release signing secrets are required for Obtainium-compatible updates"
                          exit 1
                      fi
                      exit 0
                  fi
                  keystore="$RUNNER_TEMP/unbound-android-release.keystore"
                  printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
                  echo "ANDROID_SIGNING_STORE_FILE=$keystore" >> "$GITHUB_ENV"

            - name: Derive the pull request bundle URL
              env:
                  PR_NUMBER: ${{ inputs.pr_number || '' }}
                  CDN_URL: ${{ vars.CDN_URL }}
              run: |
                  if [ -n "$PR_NUMBER" ] && [ -n "$CDN_URL" ]; then
                    echo "UNBOUND_BUNDLE_URL=${CDN_URL%/}/unbound/pr/$PR_NUMBER/" >> "$GITHUB_ENV"
                  fi

            - name: Build module
              working-directory: packages/loader/android
              run: ./gradlew :module:assembleRelease --build-cache --quiet --console=plain -PunboundBuildNumber="${GITHUB_RUN_NUMBER}"

            - name: Test module
              working-directory: packages/loader/android
              run: ./gradlew :module:testDebugUnitTest --build-cache --quiet --console=plain

            - name: Collect module
              id: collect
              run: |
                  set -euo pipefail
                  name="app.unbound.android.lsposed.apk"
                  cp android/module/build/outputs/apk/release/module-release.apk "$name"
                  echo "module_filename=$name" >> "$GITHUB_OUTPUT"

            - name: Collect native symbols and build IDs
              run: |
                  set -euo pipefail
                  module=android/module/build/outputs/apk/release/module-release.apk
                  readelf=$(find "$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt" -path '*/bin/llvm-readelf' -print -quit)
                  test -x "$readelf"
                  mkdir -p android-symbols
                  unzip -q android/module/build/outputs/native-debug-symbols/release/native-debug-symbols.zip -d android-symbols
                  for abi in arm64-v8a x86_64; do
                    symbols="android-symbols/$abi/libunbound.so.dbg"
                    library="$RUNNER_TEMP/$abi-libunbound.so"
                    test -f "$symbols"
                    sections=$("$readelf" -S "$symbols" 2>/dev/null)
                    grep -q '\.debug_info' <<< "$sections"
                    unzip -p "$module" "lib/$abi/libunbound.so" > "$library"
                    library_id=$("$readelf" -n "$library" | awk '/Build ID:/ { print $3 }')
                    symbols_id=$("$readelf" -n "$symbols" 2>/dev/null | awk '/Build ID:/ { print $3 }')
                    test -n "$library_id"
                    test "$library_id" = "$symbols_id"
                    printf '%s %s\n' "$abi" "$library_id" >> android-symbols/build-ids.txt
                  done
                  test -s android-symbols/build-ids.txt
                  git rev-parse HEAD > android-symbols/commit.txt

            - name: Upload native symbols
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: android symbols
                  path: packages/loader/android-symbols/
                  if-no-files-found: error
                  retention-days: ${{ github.event_name == 'pull_request' && 14 || 0 }}

            - name: Upload module
              id: upload-module
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: android module
                  path: packages/loader/${{ steps.collect.outputs.module_filename }}
                  retention-days: ${{ github.event_name == 'pull_request' && 14 || 0 }}

    patch-discord:
        name: Build patched Discord APK
        needs: build-module
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        outputs:
            patched_filename: ${{ steps.patch.outputs.patched_filename }}
            patched_url: ${{ steps.upload-patched.outputs.artifact-url }}
        env:
            LSPATCH_VERSION: v1.2
            LSPATCH_JAR: lspatch-v1.2-487-release.jar
            LSPATCH_SHA256: d238fdc414d121b7fa454d8b4ccf420df3a8c97d563761861ff92bd9c5da2165
            DISCORD_CERT_SHA256: 3c39d23cf9367849a5c699395647fe0e5bfea5a1f1f40d8c717ddc70f8bfa113
            DISCORD_TRACKER: https://tracker.vendetta.rocks/tracker
            DISCORD_SNIFF_URL: https://sniff.xhyrom.dev
            DISCORD_CHANNEL: ${{ inputs.discord_channel || 'stable' }}
            ANDROID_CODE: ${{ inputs.android_code }}
            IOS_VERSION: ${{ inputs.ios_version }}
            REQUIRE_MATCHING_VERSION: ${{ inputs.require_matching_version }}
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 1

            - name: Setup Go tools
              uses: ./.github/actions/setup-go-tools

            - name: Setup Java
              uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
              with:
                  distribution: temurin
                  java-version: '21'

            - name: Download module
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
              with:
                  name: android module
                  path: packages/loader/module

            - name: Download LSPatch
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  gh release download "$LSPATCH_VERSION" -R JingMatrix/LSPatch -p "$LSPATCH_JAR"
                  echo "$LSPATCH_SHA256  $LSPATCH_JAR" | sha256sum -c -

            - name: Download Discord
              id: discord
              run: |
                  set -euo pipefail
                  version="$ANDROID_CODE"
                  if [ -z "$version" ] && [ "$DISCORD_CHANNEL" != stable ]; then
                      version=$(env -u GITHUB_OUTPUT go run ./tools discord-apk --channel "$DISCORD_CHANNEL" | jq -er '.code')
                  elif [ -z "$version" ]; then
                      latest_version=$(curl -fsSL "$DISCORD_TRACKER/index" | jq -r '.latest.stable')
                      if [[ "$IOS_VERSION" =~ ^([0-9]+)\.([0-9]+)(\.|_|$) ]]; then
                          candidate="${BASH_REMATCH[1]}$(printf '%03d' "${BASH_REMATCH[2]}")"
                          if [ "$REQUIRE_MATCHING_VERSION" = true ]; then
                              version="$candidate"
                          elif curl -fsSL --range 0-0 --max-time 15 -o /dev/null "$DISCORD_TRACKER/download/$candidate/base"; then
                              version="$candidate"
                          fi
                      fi
                      if [ "$REQUIRE_MATCHING_VERSION" = true ] && [ -z "$version" ]; then
                          echo "::error::Cannot derive an Android version matching iOS version $IOS_VERSION"
                          exit 1
                      fi
                      version="${version:-$latest_version}"
                  fi
                  split_args=()
                  for split in base config.arm64_v8a config.armeabi_v7a config.x86_64 config.xxhdpi config.en; do
                      split_args+=(--split "$split")
                  done
                  env -u GITHUB_OUTPUT go run ./tools discord-apk --channel "$DISCORD_CHANNEL" --code "$version" --output-dir discord "${split_args[@]}" > /dev/null
                  build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
                  apk_version_code=$("$build_tools/aapt" dump badging discord/base.apk | sed -n "s/^package: name='com.discord' versionCode='\\([^']*\\)'.*/\\1/p")
                  if [ -z "$apk_version_code" ] || [ "$apk_version_code" != "$version" ]; then
                      echo "::error::Android source version code $apk_version_code does not match selected version code $version"
                      exit 1
                  fi
                  apksigner="$build_tools/apksigner"
                  for apk in discord/*.apk; do
                      certificates=$("$apksigner" verify --print-certs "$apk")
                      if ! grep -Eq "^(V[0-9.]+ )?Signer( #1)?:? certificate SHA-256 digest: $DISCORD_CERT_SHA256" <<< "$certificates"; then
                          echo "::error::$apk is not signed by Discord"
                          exit 1
                      fi
                  done
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Patch Discord
              id: patch
              run: |
                  set -euo pipefail
                  mkdir patched
                  java -jar "$LSPATCH_JAR" discord/*.apk -m module/*.apk -l 2 -o patched -f
                  mkdir emulator
                  mv patched/config.x86_64*.apk emulator/
                  name="Unbound.apks"
                  if [ "$DISCORD_CHANNEL" != stable ]; then name="Unbound-$DISCORD_CHANNEL.apks"; fi
                  (cd patched && zip -q "../$name" ./*.apk)
                  echo "patched_filename=$name" >> "$GITHUB_OUTPUT"

            - name: Upload patched Discord
              id: upload-patched
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: patched discord
                  path: packages/loader/${{ steps.patch.outputs.patched_filename }}
                  retention-days: ${{ github.event_name == 'pull_request' && 14 || 0 }}

            - name: Upload the emulator split
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: patched discord emulator split
                  path: packages/loader/emulator/*.apk
                  if-no-files-found: error
                  retention-days: 1

    smoke:
        name: Smoke test patched Discord
        needs: patch-discord
        runs-on: ubuntu-26.04
        timeout-minutes: 40
        permissions:
            contents: read
            actions: read
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 1

            - name: Setup Go tools
              uses: ./.github/actions/setup-go-tools

            - name: Setup Bun dependencies
              uses: ./.github/actions/setup-bun-deps
              with:
                  bun-version: canary

            - name: Build the client and the plugins
              working-directory: .
              env:
                  TMPDIR: ${{ runner.temp }}
              run: |
                  set -euo pipefail
                  bun run --cwd packages/client build
                  bun run plugins:build

            - name: Download patched Discord
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
              with:
                  name: patched discord
                  path: packages/loader/smoke/package

            - name: Download the emulator split
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
              with:
                  name: patched discord emulator split
                  path: packages/loader/smoke/apks

            - name: Unpack patched Discord
              run: unzip -q smoke/package/*.apks -d smoke/apks

            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm

            - name: Run the smoke test
              uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
              with:
                  api-level: 34
                  target: google_apis
                  arch: x86_64
                  profile: pixel_6
                  ram-size: 4096M
                  disk-size: 8G
                  emulator-boot-timeout: 900
                  emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
                  disable-animations: true
                  working-directory: packages/loader
                  script: go run ./tools smoke android --apks smoke/apks --client ../client/dist --artifacts smoke/artifacts --timeout 12m --bundle-budget 45s --plugins-budget 20s --plugin-start-budget 1s

            - name: Compare startup and the console with main
              if: success() && github.event_name == 'pull_request'
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
              run: go run ./tools smoke-regression --current smoke/artifacts/startup.json --repo "$GITHUB_REPOSITORY"

            - name: Upload smoke test logs
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: android smoke test
                  path: packages/loader/smoke/artifacts/
                  if-no-files-found: warn
                  retention-days: 14
