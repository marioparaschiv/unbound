name: Sync Issue Templates

on:
    push:
        branches:
            - main
        paths:
            - 'packages/plugins/*/manifest.json'
    schedule:
        - cron: '41 5 * * 1'
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: issue-templates
    cancel-in-progress: false

jobs:
    sync:
        if: github.repository == 'marioparaschiv/unbound'
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - name: Setup Bun dependencies
              uses: ./.github/actions/setup-bun-deps
              with:
                  frozen-lockfile: 'true'
            - name: List every plugin in the issue forms
              run: bun run plugins:issue-templates
            - name: Commit the forms
              env:
                  GH_TOKEN: ${{ github.token }}
                  LEFTHOOK: '0'
              run: |
                  if git diff --quiet -- .github/ISSUE_TEMPLATE; then
                      echo "The issue forms already list every plugin."
                      exit 0
                  fi
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git commit -m 'chore: list every plugin in the issue forms' -- .github/ISSUE_TEMPLATE
                  git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
