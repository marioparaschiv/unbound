name: Client CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun install
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun test --path-ignore-patterns 'packages/plugins/**' --path-ignore-patterns 'packages/client/tests/native.test.ts'
      - run: bun test --isolate packages/client/tests/native.test.ts
      - run: bun run generate-sdk
      # Releases replace the generated `<version>-<hash>` with the plain release version.
      - run: |
          git diff --exit-code -I '^\s*"version": ' -- packages/api/src packages/api/package.json
      - run: bun run --cwd packages/client build
