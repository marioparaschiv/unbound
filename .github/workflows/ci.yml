name: Client CI

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

concurrency:
    group: client-ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    validate:
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - name: Setup Bun dependencies
              uses: ./.github/actions/setup-bun-deps
              with:
                  bun-version: canary
            - name: Check formatting
              run: bun run fmt:js:check
            - name: Lint
              run: bun run lint:js

            - name: Typecheck
              run: bun run typecheck

            # The test helper creates and drops databases, so the role needs CREATEDB but not superuser.
            - name: Create the test database role
              run: psql -c "CREATE ROLE unbound_bot LOGIN CREATEDB PASSWORD 'unbound_bot'"
              env:
                  PGHOST: localhost
                  PGUSER: postgres
                  PGPASSWORD: postgres
            - name: Run tests
              env:
                  DATABASE_URL: postgres://unbound_bot:unbound_bot@localhost:5432/postgres
                  POSTGRES_SUPERUSER_URL: postgres://postgres:postgres@localhost:5432/postgres
              run: bun test --path-ignore-patterns 'packages/plugins/**' --path-ignore-patterns 'packages/plugin-scripts/**' --path-ignore-patterns 'packages/client/tests/native.test.ts'
            - name: Run native bridge tests
              run: bun test --isolate packages/client/tests/native.test.ts
            - name: Generate the plugin SDK
              run: bun run generate-sdk
            # Releases replace the generated `<version>-<hash>` with the plain release version.
            - name: Check the generated SDK is up to date
              run: |
                  git diff --exit-code -I '^[[:space:]]*"version": ' -- packages/api/src packages/api/package.json
            - name: Build the client
              env:
                  TMPDIR: ${{ runner.temp }}
              run: bun run --cwd packages/client build
              env:
                  UNBOUND_BUNDLE_SIGNING_KEY: ${{ secrets.UNBOUND_BUNDLE_SIGNING_KEY }}
            - name: Check the bundle signatures
              env:
                  SIGNING_KEY_PRESENT: ${{ secrets.UNBOUND_BUNDLE_SIGNING_KEY != '' }}
              run: |
                  if [ "$SIGNING_KEY_PRESENT" != true ]; then
                      echo "No signing key in this run, so the bundles are unsigned."
                      exit 0
                  fi
                  bun run --cwd packages/client verify-signatures
