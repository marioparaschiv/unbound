name: Loader Core

# Fuzzing runs nightly in native-fuzz.yml; this workflow keeps the unit tests every build needs.
on:
    workflow_call:
    workflow_dispatch:

concurrency:
    group: core-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
    cancel-in-progress: true

permissions:
    contents: read

defaults:
    run:
        working-directory: packages/loader

jobs:
    core-tests:
        name: Shared core tests
        runs-on: ubuntu-26.04
        timeout-minutes: 12
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
                  fetch-depth: 1

            - name: Setup ccache
              uses: ./.github/actions/setup-ccache
              with:
                  key: core-tests

            - name: Configure core
              run: cmake -S core -B build/core -DUNBOUND_CORE_TESTS=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined"

            - name: Build core
              run: cmake --build build/core -j"$(nproc)"

            - name: Run core tests
              run: ctest --test-dir build/core --output-on-failure --timeout 120 -j"$(nproc)" -E '_fuzz$'

            - name: Save ccache
              if: ${{ !cancelled() }}
              uses: ./.github/actions/save-ccache
              with:
                  key: core-tests

    native-jsi-fuzz:
        name: Host Hermes bridge tests
        runs-on: ubuntu-26.04
        timeout-minutes: 40
        env:
            HERMES_TAG: hermes-v250829098.0.14
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
                  fetch-depth: 1

            - name: Fetch Hermes
              run: git clone --depth 1 --branch "$HERMES_TAG" https://github.com/facebook/hermes.git build/hermes-src

            - name: Check Hermes matches the vendored JSI
              run: cmp vendor/react/jsi/jsi.h build/hermes-src/API/jsi/jsi/jsi.h

            - name: Pin Hermes and vendored source times
              run: find build/hermes-src vendor -exec touch -h -d '2000-01-01T00:00:00Z' {} +

            - name: Cache the Hermes build
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
              with:
                  path: packages/loader/build/jsi-fuzz
                  key: jsi-fuzz-ninja-${{ runner.os }}-${{ env.HERMES_TAG }}-${{ hashFiles('packages/loader/vendor/**') }}

            - name: Install libffi, Ninja and lld
              uses: ./.github/actions/apt-install
              with:
                  packages: libffi-dev ninja-build lld

            - name: Setup ccache
              uses: ./.github/actions/setup-ccache
              with:
                  key: hermes-bridge

            - name: Configure the fuzzer
              run: cmake -S core -B build/jsi-fuzz -G Ninja -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -DUNBOUND_CORE_TESTS=ON -DUNBOUND_CORE_JSI_FUZZ=ON -DUNBOUND_HERMES_SOURCE_DIR="$PWD/build/hermes-src" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_FLAGS="-fsanitize=address,undefined" -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"

            - name: Build the Hermes tests and fuzzer
              run: cmake --build build/jsi-fuzz --target native_platform_hermes native_runtime_hermes unbound_native_hermes native_define_stage_hermes native_fabric_hermes native_handle_leases_hermes native_struct_layouts_hermes native_jsi_fuzz -j"$(nproc)"

            - name: Save ccache
              if: ${{ !cancelled() }}
              uses: ./.github/actions/save-ccache
              with:
                  key: hermes-bridge

            - name: Test the native bridge on Hermes
              run: |
                  build/jsi-fuzz/native_platform_hermes
                  build/jsi-fuzz/unbound_native_hermes
                  build/jsi-fuzz/native_define_stage_hermes
                  build/jsi-fuzz/native_fabric_hermes
                  build/jsi-fuzz/native_handle_leases_hermes
                  build/jsi-fuzz/native_struct_layouts_hermes
                  build/jsi-fuzz/native_runtime_hermes | tee runtime.log
                  grep -q "FFI included" runtime.log

            # A few hundred values replay kRegressionSources and check the generator; native-fuzz.yml fuzzes nightly.
            - name: Replay the JSI fuzz regressions
              env:
                  UNBOUND_FUZZ_ITERATIONS: '500'
              run: build/jsi-fuzz/native_jsi_fuzz
