name: Pull Request Builds Cleanup

on:
    pull_request_target:
        types: [closed]

permissions:
    contents: read

concurrency:
    group: pr-builds-${{ github.event.pull_request.number }}
    cancel-in-progress: false

jobs:
    delete:
        name: Delete pull request builds
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        env:
            PR_NUMBER: ${{ github.event.pull_request.number }}
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  fetch-depth: 1

            - name: Setup Bun
              uses: ./.github/actions/setup-bun-deps
              with:
                  bun-version: canary
                  install: 'false'

            - name: Check the bucket configuration
              id: config
              env:
                  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
                  S3_REGION: ${{ vars.S3_REGION }}
                  S3_PUBLIC_BUCKET: ${{ vars.S3_PUBLIC_BUCKET }}
                  HAS_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID != '' }}
                  HAS_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY != '' }}
              run: bun scripts/pr-builds-plan.ts cleanup

            - name: Install dependencies
              if: steps.config.outputs.enabled == 'true'
              run: bun install

            - name: Delete the client and loader builds
              if: steps.config.outputs.enabled == 'true'
              env:
                  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
                  S3_REGION: ${{ vars.S3_REGION }}
                  S3_PUBLIC_BUCKET: ${{ vars.S3_PUBLIC_BUCKET }}
                  S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
                  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
              run: bun scripts/pr-builds.ts delete "$PR_NUMBER" | tee -a "$GITHUB_STEP_SUMMARY"
