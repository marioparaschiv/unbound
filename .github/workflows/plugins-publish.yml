# Publishes every first-party plugin, theme and icon pack whose manifest version is newer than the live one, without review.
# The icon packs are the unbound-app/icon-packs submodule; when it cannot be fetched, only they are skipped.
#
# Secret `UNBOUND_API_KEY`: an API key of the CI account, whose role is `ci`. To mint it, an admin sets
# that account's role to `ci` on /admin/users; then, signed in as that account, create the key on
# /account under API keys. The server must have FIRST_PARTY_REPOSITORY=marioparaschiv/unbound set.
# Variable `UNBOUND_API_URL`: the backend's base URL, shared with loader-build.yml.
name: Publish Addons

on:
    push:
        branches:
            - main
        paths:
            - packages/plugins/**
            - packages/themes/**
            - packages/icon-packs
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: plugins-publish
    cancel-in-progress: false

jobs:
    publish:
        if: github.repository == 'marioparaschiv/unbound' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-26.04
        # Publishing every plugin after a release-wide bump takes longer than a few minutes.
        timeout-minutes: 30
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
                  fetch-depth: 0
                  fetch-tags: true
            # `.gitmodules` sets `update = none` so no other checkout needs the icon-packs repository.
            - name: Checkout icon packs
              run: |
                  git submodule update --init --checkout packages/icon-packs \
                      || echo "::warning::Could not fetch packages/icon-packs; icon packs are not published."
            - name: Setup Bun dependencies
              uses: ./.github/actions/setup-bun-deps
              with:
                  frozen-lockfile: 'true'
            - name: Validate plugins
              run: bun run plugins:validate
            - name: Test plugins
              run: bun run plugins:test
            - name: Build plugins
              run: bun run plugins:build
            - name: Configure git identity
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            - name: Publish addons
              env:
                  UNBOUND_API_KEY: ${{ secrets.UNBOUND_API_KEY }}
                  UNBOUND_API_URL: ${{ vars.UNBOUND_API_URL }}
                  UNBOUND_BUNDLE_SIGNING_KEY: ${{ secrets.UNBOUND_BUNDLE_SIGNING_KEY }}
                  GH_TOKEN: ${{ github.token }}
              run: bun packages/plugin-scripts/src/publish-addons.ts --remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

            - name: Verify the published addons
              env:
                  UNBOUND_API_URL: ${{ vars.UNBOUND_API_URL }}
              run: |
                  for _ in 1 2 3; do
                    bun packages/plugin-scripts/src/verify-published.ts && exit 0
                    sleep 60
                  done
                  exit 1
