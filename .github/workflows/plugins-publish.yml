# Publishes every first-party plugin whose manifest version is newer than the live one, without review.
#
# Secret `UNBOUND_API_KEY`: an API key of the CI account, whose role is `ci`. To mint it, an admin sets
# that account's role to `ci` on /admin/users; then, signed in as that account, create the key on
# /account under API keys. The server must have FIRST_PARTY_REPOSITORY=marioparaschiv/unbound set.
# Variable `UNBOUND_API_URL`: the backend's base URL, shared with loader-build.yml.
name: Publish Plugins

on:
    push:
        branches:
            - main
        paths:
            - packages/plugins/**
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: plugins-publish
    cancel-in-progress: false

jobs:
    publish:
        if: github.repository == 'marioparaschiv/unbound' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0
                  fetch-tags: true
            - name: Setup Bun dependencies
              uses: ./.github/actions/setup-bun-deps
              with:
                  frozen-lockfile: 'true'
            - name: Validate plugins
              run: bun run plugins:validate
            - name: Test plugins
              run: bun run plugins:test
            - name: Build plugins
              run: bun run plugins:build
            - name: Configure git identity
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            - name: Publish plugins
              env:
                  UNBOUND_API_KEY: ${{ secrets.ASTRAL_API_KEY }}
                  UNBOUND_API_URL: ${{ vars.ASTRAL_API_URL }}
                  UNBOUND_BUNDLE_SIGNING_KEY: ${{ secrets.ASTRAL_BUNDLE_SIGNING_KEY }}
              run: bun packages/plugin-scripts/src/publish-plugins.ts

            - name: Verify the published plugins
              env:
                  UNBOUND_API_URL: ${{ vars.ASTRAL_API_URL }}
              run: |
                  for _ in 1 2 3; do
                    bun packages/plugin-scripts/src/verify-published.ts && exit 0
                    sleep 60
                  done
                  exit 1
