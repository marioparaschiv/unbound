name: Release

# release-please keeps one release PR open against main, versioning only the packages whose files
# changed (plus their workspace dependents); merging it tags and publishes those packages.
on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write
    issues: write
    pull-requests: write
    id-token: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        outputs:
            releases-created: ${{ steps.release.outputs.releases_created }}
            client-released: ${{ steps.release.outputs['packages/client--release_created'] }}
            client-version: ${{ steps.release.outputs['packages/client--version'] }}
        steps:
            - name: Run release-please
              id: release
              uses: googleapis/release-please-action@v5

            # release-please bumps package.json versions but only knows npm lockfiles, so the
            # workspace versions recorded in bun.lock are refreshed on the release PR branch.
            - name: Checkout code
              if: steps.release.outputs.prs_created == 'true'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

            # bun.lock is lockfileVersion 2, which stable bun cannot parse until 1.4 releases.
            # canary's frozen-lockfile check fails on a self-generated lockfile (round-trip bug),
            # so install without it until stable 1.4 lands.
            - name: Setup Bun dependencies
              if: steps.release.outputs.prs_created == 'true'
              uses: ./.github/actions/setup-bun-deps
              with:
                  bun-version: canary
                  install: 'false'

            - name: Sync bun.lock with the release versions
              if: steps.release.outputs.prs_created == 'true'
              run: |
                  bun install
                  git diff --quiet -- bun.lock && exit 0

                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git commit -m 'chore: sync bun.lock with the release versions' -- bun.lock
                  git push

    publish:
        needs: release
        if: needs.release.outputs.releases-created == 'true'
        runs-on: ubuntu-26.04
        timeout-minutes: 15
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - name: Setup Bun dependencies
              uses: ./.github/actions/setup-bun-deps
              with:
                  bun-version: canary

            # Publishing uses npm trusted publishing (OIDC), which needs npm >= 11.5.1; the runner's
            # preinstalled npm is older.
            - name: Update npm
              run: npm install --global npm@latest

            # Skips every package whose version is already on npm, so only the released ones publish.
            - name: Publish packages
              run: bun scripts/publish-all.ts

    bundle:
        needs: release
        if: needs.release.outputs.client-released == 'true'
        uses: ./.github/workflows/build-bundle.yml
        with:
            version: ${{ needs.release.outputs.client-version }}
        secrets: inherit
