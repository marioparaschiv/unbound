name: Nightly native fuzzing

on:
    schedule:
        - cron: '37 3 * * *'
    workflow_dispatch:
        inputs:
            minutes:
                description: 'Minutes to fuzz JS-to-native conversion'
                default: '20'

permissions:
    contents: read

concurrency:
    group: native-fuzz
    cancel-in-progress: false

defaults:
    run:
        working-directory: packages/loader

jobs:
    fuzz:
        name: Fuzz the native bridge with libFuzzer
        runs-on: ubuntu-26.04
        timeout-minutes: 60
        permissions:
            contents: read
            issues: write
            actions: read
        env:
            HERMES_TAG: hermes-v250829098.0.14
            JSI_MINUTES: ${{ (inputs.minutes || '20') }}
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
                  fetch-depth: 1

            - name: Fetch Hermes
              run: git clone --depth 1 --branch "$HERMES_TAG" https://github.com/facebook/hermes.git build/hermes-src

            - name: Check Hermes matches the vendored JSI
              run: cmp vendor/react/jsi/jsi.h build/hermes-src/API/jsi/jsi/jsi.h

            - name: Pin Hermes and vendored source times
              run: find build/hermes-src vendor -exec touch -h -d '2000-01-01T00:00:00Z' {} +

            - name: Cache the fuzzer build
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
              with:
                  path: packages/loader/build/libfuzzer
                  key: native-libfuzzer-${{ runner.os }}-${{ env.HERMES_TAG }}-${{ hashFiles('packages/loader/vendor/**') }}

            - name: Restore the corpus from the last nightly run
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  mkdir -p build/fuzz-corpus
                  previous=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow native-fuzz.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
                  if [ -z "$previous" ] || ! gh run download "$previous" --repo "$GITHUB_REPOSITORY" --name 'native fuzz corpus' --dir build/fuzz-corpus; then
                      echo "::notice::No earlier corpus to restore; fuzzing starts from the seeds."
                  fi

            - name: Configure the fuzzers
              run: cmake -S core -B build/libfuzzer -DUNBOUND_CORE_TESTS=ON -DUNBOUND_CORE_FUZZ=ON -DUNBOUND_CORE_JSI_FUZZ=ON -DUNBOUND_HERMES_SOURCE_DIR="$PWD/build/hermes-src" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_FLAGS="-fsanitize=fuzzer-no-link,address,undefined" -DCMAKE_CXX_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -fno-sanitize-recover=all"

            - name: Build the fuzzers
              run: cmake --build build/libfuzzer --target native_jsi_libfuzzer native_bridge_libfuzzer -j"$(nproc)"

            - name: Fuzz JS-to-native conversion
              run: |
                  set -o pipefail
                  mkdir -p build/fuzz-corpus/jsi build/fuzz-crashes build/fuzz-logs
                  build/libfuzzer/native_jsi_libfuzzer build/fuzz-corpus/jsi -max_total_time=$(( JSI_MINUTES * 60 )) -max_len=512 -timeout=10 -rss_limit_mb=4096 -detect_leaks=0 -artifact_prefix=build/fuzz-crashes/jsi- 2>&1 | tee build/fuzz-logs/jsi.log

            - name: Fuzz the native parsers
              run: |
                  set -o pipefail
                  mkdir -p build/fuzz-corpus/bridge build/fuzz-crashes build/fuzz-logs
                  build/libfuzzer/native_bridge_libfuzzer build/fuzz-corpus/bridge core/tests/fuzz/corpus -max_total_time=600 -max_len=4096 -artifact_prefix=build/fuzz-crashes/bridge- 2>&1 | tee build/fuzz-logs/bridge.log

            - name: Minimise the corpus
              run: |
                  for corpus in jsi bridge; do
                    mkdir -p "build/fuzz-corpus/$corpus-min"
                    build/libfuzzer/native_${corpus}_libfuzzer -merge=1 "build/fuzz-corpus/$corpus-min" "build/fuzz-corpus/$corpus" > /dev/null 2>&1 || true
                    rm -rf "build/fuzz-corpus/$corpus" && mv "build/fuzz-corpus/$corpus-min" "build/fuzz-corpus/$corpus"
                  done
                  du -sh build/fuzz-corpus/* | tee -a "$GITHUB_STEP_SUMMARY"

            - name: Keep the corpus for the next run
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: native fuzz corpus
                  path: packages/loader/build/fuzz-corpus/
                  if-no-files-found: ignore
                  retention-days: 30

            - name: Build the fuzz tests
              run: cmake --build build/libfuzzer --target native_jsi_fuzz addon_discovery_fuzz font_files_fuzz native_bridge_fuzz settings_fuzz theme_fuzz -j"$(nproc)"

            - name: Run the fuzz tests
              run: |
                  set -o pipefail
                  mkdir -p build/fuzz-logs
                  ctest --test-dir build/libfuzzer --output-on-failure --timeout 900 -j"$(nproc)" -R '_fuzz$' -E '^native_jsi_fuzz$' 2>&1 | tee build/fuzz-logs/tests.log

            - name: Fuzz the native bridge on Hermes
              env:
                  UNBOUND_FUZZ_ITERATIONS: '20000'
              run: |
                  set -o pipefail
                  mkdir -p build/fuzz-logs
                  build/libfuzzer/native_jsi_fuzz 2>&1 | tee build/fuzz-logs/jsi-generator.log

            - name: Upload crashing inputs
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: native fuzz crashes
                  path: packages/loader/build/fuzz-crashes/
                  if-no-files-found: ignore
                  retention-days: 30

            - name: Report the crash
              if: failure() && github.event_name == 'schedule'
              env:
                  GH_TOKEN: ${{ github.token }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  set -euo pipefail
                  gh label create native-fuzz --repo "$GITHUB_REPOSITORY" --color B60205 --description "The nightly native fuzzer found a crash" --force >/dev/null
                  existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label native-fuzz --state open --json number --jq '.[0].number // empty')
                  fence='```'
                  report() {
                    local log=$1 fuzzer=$2
                    [ -s "$log" ] || return 0
                    grep -qE 'fuzz invariant broken|ERROR: (AddressSanitizer|UndefinedBehaviorSanitizer|libFuzzer)|runtime error:' "$log" || return 0
                    echo "### $fuzzer"
                    echo
                    local invariant value summary
                    invariant=$(grep -m1 'fuzz invariant broken:' "$log" | sed 's/^.*invariant broken: //' || true)
                    value=$(grep -m1 -A1 'fuzz invariant broken:' "$log" | sed -n 's/^value: //p' || true)
                    summary=$(grep -m1 -E '^SUMMARY: ' "$log" || true)
                    if [ -n "$invariant" ]; then echo "Broken invariant: **$invariant**"; echo; fi
                    if [ -n "$value" ]; then echo "Value (first 400 characters of the generated JavaScript):"; echo; echo "${fence}js"; echo "$value"; echo "$fence"; echo; fi
                    if [ -n "$summary" ]; then echo "$summary"; echo; fi
                    echo "Top of the stack:"
                    echo
                    echo "$fence"
                    grep -m1 -A40 -E 'ERROR: (AddressSanitizer|UndefinedBehaviorSanitizer|libFuzzer)|runtime error:' "$log" | grep -E '^ *#[0-9]+ ' | grep -vE 'libfuzzer|fuzzer::|libc\.so|_start|__sanitizer|__asan|__ubsan' | head -12 | sed -E 's#/home/runner/work/[^/]+/[^/]+/##'
                    echo "$fence"
                    echo
                  }
                  crashes=$(find build/fuzz-crashes -type f 2>/dev/null | sort)
                  {
                    echo "The nightly native fuzzer failed in $RUN_URL."
                    echo
                    report build/fuzz-logs/jsi.log native_jsi_libfuzzer
                    report build/fuzz-logs/bridge.log native_bridge_libfuzzer
                    report build/fuzz-logs/tests.log 'fuzz tests'
                    report build/fuzz-logs/jsi-generator.log native_jsi_fuzz
                    if [ -n "$crashes" ]; then
                      echo "### Crashing inputs"
                      echo
                      echo "Also in the \`native fuzz crashes\` artifact. Each line is \`name base64\`:"
                      echo
                      echo "$fence"
                      for crash in $crashes; do echo "$(basename "$crash") $(base64 -w0 "$crash" | head -c 6000)"; done
                      echo "$fence"
                      echo
                    fi
                    echo "### Reproduce"
                    echo
                    echo "${fence}sh"
                    echo "cd packages/loader"
                    echo "git clone --depth 1 --branch $HERMES_TAG https://github.com/facebook/hermes.git build/hermes-src"
                    echo "cmake -S core -B build/libfuzzer -DUNBOUND_CORE_TESTS=ON -DUNBOUND_CORE_FUZZ=ON -DUNBOUND_CORE_JSI_FUZZ=ON -DUNBOUND_HERMES_SOURCE_DIR=\"\$PWD/build/hermes-src\" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_FLAGS='-fsanitize=fuzzer-no-link,address,undefined' -DCMAKE_CXX_FLAGS='-fsanitize=fuzzer-no-link,address,undefined -fno-sanitize-recover=all'"
                    echo "cmake --build build/libfuzzer --target native_jsi_libfuzzer native_bridge_libfuzzer"
                    for crash in $crashes; do
                      name=$(basename "$crash")
                      case "$name" in jsi-*) fuzzer=native_jsi_libfuzzer ;; *) fuzzer=native_bridge_libfuzzer ;; esac
                      echo "echo '$(base64 -w0 "$crash" | head -c 6000)' | base64 -d > $name && build/libfuzzer/$fuzzer $name"
                    done
                    echo "$fence"
                    echo
                    echo "A JS value that breaks an invariant can also go into \`kRegressionSources\` in \`core/tests/jsi-fuzz/NativeJSIFuzz.h\`, which \`native_jsi_fuzz\` replays on every CI run."
                  } > build/fuzz-report.md
                  body=$(cat build/fuzz-report.md)
                  if [ -n "$existing" ]; then
                    gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
                  else
                    gh issue create --repo "$GITHUB_REPOSITORY" --label native-fuzz --title "Nightly native fuzzer found a crash" --body "$body"
                  fi
