name: Backfill Bundle Signatures

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: backfill-signatures
    cancel-in-progress: false

jobs:
    backfill:
        name: Sign published release bundles
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        steps:
            - name: Check the bucket configuration
              id: config
              env:
                  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
                  S3_REGION: ${{ vars.S3_REGION }}
                  S3_PUBLIC_BUCKET: ${{ vars.S3_PUBLIC_BUCKET }}
                  HAS_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID != '' }}
                  HAS_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY != '' }}
                  HAS_UNBOUND_BUNDLE_SIGNING_KEY: ${{ secrets.UNBOUND_BUNDLE_SIGNING_KEY != '' }}
              run: |
                  missing=()
                  for name in S3_ENDPOINT S3_REGION S3_PUBLIC_BUCKET; do
                    [ -n "${!name}" ] || missing+=("variable $name")
                  done
                  for name in S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY UNBOUND_BUNDLE_SIGNING_KEY; do
                    flag="HAS_$name"
                    [ "${!flag}" = true ] || missing+=("secret $name")
                  done
                  if [ "${#missing[@]}" -gt 0 ]; then
                    joined=$(printf '%s, ' "${missing[@]}")
                    reason="The backfill is off until these are configured: ${joined%, }."
                    echo "$reason" >> "$GITHUB_STEP_SUMMARY"
                    echo "::notice::$reason"
                    echo "enabled=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "enabled=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Checkout code
              if: steps.config.outputs.enabled == 'true'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 1
                  persist-credentials: false

            - name: Setup Bun dependencies
              if: steps.config.outputs.enabled == 'true'
              uses: ./.github/actions/setup-bun-deps
              with:
                  bun-version: canary

            - name: Sign unsigned stable and beta bundles
              if: steps.config.outputs.enabled == 'true'
              env:
                  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
                  S3_REGION: ${{ vars.S3_REGION }}
                  S3_PUBLIC_BUCKET: ${{ vars.S3_PUBLIC_BUCKET }}
                  S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
                  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
                  UNBOUND_BUNDLE_SIGNING_KEY: ${{ secrets.UNBOUND_BUNDLE_SIGNING_KEY }}
              run: bun run --cwd packages/client backfill-signatures | tee -a "$GITHUB_STEP_SUMMARY"
