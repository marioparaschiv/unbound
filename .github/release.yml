changelog:
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - bugfix
        - fix
    - title: Performance
      labels:
        - performance
    - title: Maintenance
      labels:
        - maintenance
        - chore
        - refactor
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - '*'
  exclude:
    labels:
      - skip-changelog
