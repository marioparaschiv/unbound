version: 2
updates:
    - package-ecosystem: 'github-actions'
      directories:
          - '/'
          - '/.github/actions/*'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 5
      commit-message:
          prefix: 'ci(deps)'

    - package-ecosystem: 'gitsubmodule'
      directory: '/'
      schedule:
          interval: 'daily'
      open-pull-requests-limit: 5
      commit-message:
          prefix: 'build(deps)'

    - package-ecosystem: 'bun'
      directory: '/'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 5
      commit-message:
          prefix: 'build(deps)'
      ignore:
          - dependency-name: 'react-native'
            update-types:
                - 'version-update:semver-minor'
                - 'version-update:semver-major'
          - dependency-name: '@babel/core'
            update-types:
                - 'version-update:semver-major'
          - dependency-name: 'typescript'
            update-types:
                - 'version-update:semver-major'
      groups:
          minor-and-patch:
              update-types:
                  - 'minor'
                  - 'patch'

    - package-ecosystem: 'gomod'
      directories:
          - '/packages/loader'
          - '/packages/loader/workflow-tests'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 5
      commit-message:
          prefix: 'build(deps)'

    - package-ecosystem: 'gradle'
      directory: '/packages/loader/android'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 5
      commit-message:
          prefix: 'build(deps)'
      groups:
          minor-and-patch:
              update-types:
                  - 'minor'
                  - 'patch'
