    - type: textarea
      id: environment
      attributes:
          label: Environment
          description: Paste the debug info from **Settings → Unbound → General → Debug Info**, or list the Discord, Unbound and loader versions and your device.
      validations:
          required: true
    - type: textarea
      id: description
      attributes:
          label: What happened?
          description: What did you expect, and what happened instead?
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          placeholder: |
              1. Open …
              2. Tap …
              3. See …
      validations:
          required: true
    - type: textarea
      id: logs
      attributes:
          label: Logs
          description: Optional. Any relevant logs or console output.
          render: text
    - type: textarea
      id: screenshots
      attributes:
          label: Screenshots or recordings
          description: Optional. Drag images or videos in here.
    - type: checkboxes
      id: checks
      attributes:
          label: Before you submit
          options:
              - label: I'm on the latest Unbound and loader version.
                required: true
              - label: I searched the existing issues and this hasn't been reported.
                required: true
              - label: This is about Unbound or a first-party plugin, not a plugin or theme from someone else.
                required: true
